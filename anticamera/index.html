<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f312f">
    <meta
      name="description"
      content="Anti-Camera is a lensless camera prototype that captures context instead of photons."
    >
    <title>Anti-Camera</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page" aria-label="Anti-Camera prototype">
      <section class="camera-shell" aria-label="Anti-Camera body">
        <div class="top-plate" aria-hidden="true">
          <span class="brand-mark">ANTI-CAMERA</span>
          <span class="body-code">AC-00</span>
        </div>

        <section class="viewfinder" id="viewfinder" aria-live="polite">
          <div class="lcd-status">
            <span class="lcd-title">VIEWFINDER</span>
            <span class="lcd-icons">
              <span class="battery-shell" aria-hidden="true"><span id="battery-fill" class="battery-fill"></span></span>
              <span id="battery-label">--%</span>
            </span>
          </div>
          <form class="key-panel hidden" id="key-panel">
            <label for="openai-key">OPENAI SECRET</label>
            <div class="key-row">
              <input id="openai-key" name="openai-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
              <button type="submit">LOAD</button>
            </div>
            <p id="key-message">USER KEY REQUIRED</p>
          </form>
          <dl class="readout" id="context-readout"></dl>
          <div class="developing hidden" id="developing">Developing...</div>
          <img class="latest-frame hidden" id="latest-frame" alt="Generated Anti-Camera frame">
        </section>

        <button class="shutter" id="shutter" type="button" aria-label="Press shutter">
          <span class="shutter-inner" aria-hidden="true"></span>
        </button>

        <section class="manual-controls" id="manual-controls" aria-label="Manual photographic controls">
          <div class="control-cluster mode-cluster subject-control-panel">
            <span class="engraved-label">SUBJ</span>
            <button
              class="subject-cycle-button"
              type="button"
              data-control="subject-cycle"
              data-selected="landscape"
              aria-label="Subject mode: LANDSCAPE. Press to change mode."
            >
              <span class="subject-icon" data-subject-icon="landscape" aria-hidden="true">
                <svg viewBox="0 0 64 64" focusable="false">
                  <path d="M7 48h50v8H7z"></path>
                  <path d="M7 48 22 25l11 15 7-10 17 18z"></path>
                  <circle cx="47" cy="18" r="7"></circle>
                </svg>
              </span>
              <span class="subject-icon" data-subject-icon="single-person" aria-hidden="true" hidden>
                <svg viewBox="0 0 64 64" focusable="false">
                  <circle cx="32" cy="21" r="12"></circle>
                  <path d="M13 56c3-15 10-23 19-23s16 8 19 23z"></path>
                </svg>
              </span>
              <span class="subject-icon" data-subject-icon="group" aria-hidden="true" hidden>
                <svg viewBox="0 0 64 64" focusable="false">
                  <circle cx="23" cy="23" r="9"></circle>
                  <circle cx="42" cy="21" r="10"></circle>
                  <path d="M7 56c3-13 9-20 18-20s15 7 18 20z"></path>
                  <path d="M24 56c3-15 9-23 19-23s15 8 18 23z"></path>
                </svg>
              </span>
              <span class="subject-icon" data-subject-icon="crowd" aria-hidden="true" hidden>
                <svg viewBox="0 0 64 64" focusable="false">
                  <circle cx="14" cy="22" r="7"></circle>
                  <circle cx="32" cy="18" r="8"></circle>
                  <circle cx="50" cy="22" r="7"></circle>
                  <circle cx="23" cy="34" r="7"></circle>
                  <circle cx="41" cy="34" r="7"></circle>
                  <path d="M5 56c2-11 7-17 15-17 6 0 10 3 13 10 3-7 8-10 15-10 8 0 13 6 15 17z"></path>
                  <path d="M16 56c2-10 7-16 16-16s14 6 16 16z"></path>
                </svg>
              </span>
              <span class="subject-label" data-subject-label aria-live="polite">LANDSCAPE</span>
            </button>
          </div>

          <div class="lever-column">
            <div class="mechanical-lever" data-control="depth" role="radiogroup" aria-label="Depth selector">
              <span class="engraved-label">DEPTH</span>
              <div class="lever-track">
                <button type="button" data-focus-style="deep-focus" aria-label="Depth: deep focus">
                  <svg viewBox="0 0 34 24" aria-hidden="true">
                    <path d="M3 18h28v3H3z"></path>
                    <path d="M5 18 13 7l6 8 4-5 7 8z"></path>
                    <circle cx="25" cy="7" r="3"></circle>
                  </svg>
                </button>
                <button type="button" data-focus-style="bokeh" aria-label="Depth: bokeh">
                  <svg viewBox="0 0 34 24" aria-hidden="true">
                    <circle cx="9" cy="8" r="5"></circle>
                    <circle cx="24" cy="7" r="3"></circle>
                    <circle cx="20" cy="17" r="5"></circle>
                    <path d="M5 20h24v2H5z"></path>
                  </svg>
                </button>
                <span class="lever-thumb" aria-hidden="true"></span>
              </div>
            </div>

            <div class="mechanical-lever flash-lever" data-control="flash" role="radiogroup" aria-label="Flash selector">
              <span class="engraved-label">FLASH</span>
              <div class="lever-track">
                <button type="button" data-flash-mode="off" aria-label="Flash off">OFF</button>
                <button type="button" data-flash-mode="on" aria-label="Flash on">
                  <svg viewBox="0 0 22 28" aria-hidden="true">
                    <path d="M12 1 3 15h7l-2 12 11-16h-7z"></path>
                  </svg>
                  ON
                </button>
                <span class="lever-thumb" aria-hidden="true"></span>
              </div>
            </div>
          </div>

          <div class="dial-row">
            <div class="analog-dial ev-dial" data-dial="ev" tabindex="0" role="group" aria-label="Exposure compensation dial">
              <span class="engraved-label">EV</span>
              <span class="dial-index" aria-hidden="true"></span>
              <div class="dial-face dial-scale" data-dial-face>
                <button type="button" data-ev="-3" style="--tick-angle: -120deg" aria-label="Set exposure compensation to -3 EV">-3</button>
                <button type="button" data-ev="-2" style="--tick-angle: -80deg" aria-label="Set exposure compensation to -2 EV">-2</button>
                <button type="button" data-ev="-1" style="--tick-angle: -40deg" aria-label="Set exposure compensation to -1 EV">-1</button>
                <button type="button" data-ev="0" style="--tick-angle: 0deg" aria-label="Set exposure compensation to 0 EV">0</button>
                <button type="button" data-ev="1" style="--tick-angle: 40deg" aria-label="Set exposure compensation to +1 EV">+1</button>
                <button type="button" data-ev="2" style="--tick-angle: 80deg" aria-label="Set exposure compensation to +2 EV">+2</button>
                <button type="button" data-ev="3" style="--tick-angle: 120deg" aria-label="Set exposure compensation to +3 EV">+3</button>
                <span class="dial-grip dial-rotor" aria-hidden="true"></span>
              </div>
            </div>

            <div class="analog-dial iso-dial" data-dial="iso" tabindex="0" role="group" aria-label="ISO dial">
              <span class="engraved-label">ASA / ISO</span>
              <span class="dial-index" aria-hidden="true"></span>
              <div class="dial-face dial-scale" data-dial-face>
                <button type="button" data-iso="80" style="--tick-angle: -132deg" aria-label="Set ISO to 80">80</button>
                <button type="button" data-iso="100" style="--tick-angle: -108deg" aria-label="Set ISO to 100">100</button>
                <button type="button" data-iso="125" style="--tick-angle: -84deg" aria-label="Set ISO to 125">125</button>
                <button type="button" data-iso="160" style="--tick-angle: -60deg" aria-label="Set ISO to 160">160</button>
                <button type="button" data-iso="200" style="--tick-angle: -36deg" aria-label="Set ISO to 200">200</button>
                <button type="button" data-iso="250" style="--tick-angle: -12deg" aria-label="Set ISO to 250">250</button>
                <button type="button" data-iso="320" style="--tick-angle: 12deg" aria-label="Set ISO to 320">320</button>
                <button type="button" data-iso="400" style="--tick-angle: 36deg" aria-label="Set ISO to 400">400</button>
                <button type="button" data-iso="500" style="--tick-angle: 60deg" aria-label="Set ISO to 500">500</button>
                <button type="button" data-iso="640" style="--tick-angle: 84deg" aria-label="Set ISO to 640">640</button>
                <button type="button" data-iso="800" style="--tick-angle: 108deg" aria-label="Set ISO to 800">800</button>
                <button type="button" data-iso="1000" style="--tick-angle: 132deg" aria-label="Set ISO to 1000">1000</button>
                <span class="dial-grip dial-rotor" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </section>

        <fieldset class="indoor-toggle" aria-label="Indoor or outdoor">
          <legend class="sr-only">Indoor or outdoor</legend>
          <input type="radio" id="mode-outdoor" name="scene-mode" value="outdoor" checked>
          <label for="mode-outdoor">Outdoor</label>
          <input type="radio" id="mode-indoor" name="scene-mode" value="indoor">
          <label for="mode-indoor">Indoor</label>
        </fieldset>
      </section>

      <section class="film-rack" aria-label="Film strip">
        <div class="film-rack-top">
          <span>FILM</span>
          <button class="json-button" id="export-json" type="button">JSON</button>
        </div>
        <ol class="film-strip" id="film-strip"></ol>
      </section>
    </main>

    <script type="module" src="./assets/main.js"></script>
  </body>
</html>
