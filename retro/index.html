<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRT Web Browser - Retro 3D Experience</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="url-overlay">
        <input type="text" id="url-input" placeholder="Enter URL to browse..." value="https://agent1c-ai.github.io">
    </div>
    
    <canvas id="webgl"></canvas>
    <div id="css3d-root"></div>
    
    <div id="hint" style="display: none;">Press ESC to exit screen</div>
    <div id="toast-container"></div>

    <footer style="position: fixed; bottom: 10px; right: 10px; color: rgba(255,255,255,0.5); font-size: 11px; z-index: 1000;">
        <a href="https://berrry.app" target="_blank" style="color: rgba(255,255,255,0.7); text-decoration: none;">made with 🍓 berrry.app</a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="app.js"></script>
</body>
</html>
