<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>KODOK — Neon Doom</title>
<style>html, body { margin:0; padding:0; background:#050510; overflow:hidden; font-family:'Press Start 2P',monospace; }</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div id="start-screen">
  <h1>KODOK</h1>
  <p>TAP TO START</p>
</div>

<script>
(() => {
'use strict';
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a051f, 0.03);
scene.background = new THREE.Color(0x060718);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x44aaff, 0x113355, 0.3));
const dirL = new THREE.DirectionalLight(0xffffff, 0.7);
dirL.position.set(-8, 25, -6); scene.add(dirL);
scene.add(new THREE.PlaneGeometry(90, 90).rotateX(-Math.PI/2) as any);
for (let i = 0; i < 14; i++) { const g=new THREE.BoxGeometry(3.5,5,2); scene.add(new THREE.Mesh(g)); }

// enemies + particles
const enemies=[], particles=[];
for (let i = 0; i < 8; i++) enemies.push({x:Math.cos(i*1.3)*25,z:i*2});
for (let i = 0; i < 40; i++) particles.push(new THREE.Mesh(new THREE.SphereGeometry(0.2,6)));

// click handler — always works on mobile
document.addEventListener('click', function(e) {
  const ss = document.getElementById('start-screen');
  if (ss && gameActive === false) { e.preventDefault(); e.stopPropagation(); startGame(); }
}, false);

function startGame() {
  const s = document.getElementById('start-screen');
  if (s) s.style.display='none';
  gameActive = true; lastFrame = Date.now(); keys={w:false,s:false,a:false,d:false};
}
let yawAxis=0, dz=1, cam_z=-5, lastFrame=0, keys={}, dx=0, dy=0, gameActive=false;

// document click listener (mobile-friendly)
document.addEventListener('click', function() { startGame(); }, false);

function update() {
  if (!gameActive || !scene.camera.position) return;
  const dt = Math.min((Date.now()-lastFrame)/16, 1); lastFrame = Date.now();
  scene.camera.position.x += dx * dt;
  scene.camera.position.y = 3.5;
  scene.camera.position.z -= dz * dt;
}

function run() { if (!gameActive) startGame(); update(); renderer.render(scene, scene.camera); requestAnimationFrame(run); }
run();
})();
</script>
</body>
</html>
