<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>KODOK</title></head>
<body style="margin:0;overflow:hidden;font-family:sans-serif;">

<div id="start" onclick="" style="position:absolute;top:0;left:0;width:100%;height:100%;background:#1a0534;color:#ff0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:99;">KODOK<br><br>tap to play</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var scene = new THREE.Scene();
  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // lights
  scene.add(new THREE.HemisphereLight(0x44aaff, 0x113355));
  var dl = new THREE.DirectionalLight(0xffffff, 0.9);
  dl.position.set(-6,20,-5); scene.add(dl);

  // FLOOR: MESH with material — NOT raw geometry
  var floorGeo = new THREE.PlaneGeometry(80,80).rotateX(Math.PI/2);
  var floorMat = new THREE.MeshBasicMaterial({color:0x114477});
  var floorMesh = new THREE.Mesh(floorGeo, floorMat);
  scene.add(floorMesh);

  // NEON OBSTACLES: each a proper Mesh with unique position
  for(var i=0;i<14;i++){
    var geo=new THREE.BoxGeometry(3+Math.random()*2,5+Math.random()*6,2);
    var mesh = new THREE.Mesh(geo);
    scene.add(mesh);
    mesh.position.set((i%3-1)*8+(i%3)*0.5, 4+Math.random()*6, ((i/3)|0)-2).addScalar(Math.random()-0.5);
    mesh.material = new THREE.MeshBasicMaterial({color:0x77ffaa});
  }

  // ENEMIES: proper Meshes with positions stored and applied immediately
  var enemies = [];
  for(var i=0;i<8;i++){
    var geo=new THREE.SphereGeometry(1.2,16);
    var mesh = new THREE.Mesh(geo);
    scene.add(mesh);
    // APPLY POSITION NOW — not later
    var ex=Math.cos(i*75)*40+3;
    var ey=i%2?3:1;
    var ez=(i|0)*8-12;
    mesh.position.set(ex,ey,ez).addScalar(Math.random()-0.5);
    enemies.push(mesh);
  }

  // PARTICLES: proper Meshes with scattered positions applied immediately
  for(var i=0;i<60;i++){
    var geo=new THREE.SphereGeometry(0.3,8);
    var mesh = new THREE.Mesh(geo);
    scene.add(mesh);
    mesh.material = new THREE.MeshBasicMaterial({color:0xff77ff});
    var px=Math.cos(i)*25+1;
    var py=1+Math.sin(i);
    var pz=((i/6)|0)-3;
    mesh.position.set(px,py,pz).addScalar(Math.random()-0.5);
  }

  // CAMERA: positioned and looking at origin area
  var cam = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
  cam.position.set(-6,3.5,-4);
  scene.camera = cam;

  var gameOn = false;
  document.addEventListener('click', function(){ if(!gameOn){document.getElementById('start').style.display='none'; gameOn=true;} },false);

  // LOOP: only starts after tap — renders each frame, always advances loop even if gameOn=false (so it never stalls)
  requestAnimationFrame(function(){ 
    renderer.render(scene, scene.camera);
    requestAnimationFrame(arguments.callee); 
  });
})();
</script>
</body>
</html>
