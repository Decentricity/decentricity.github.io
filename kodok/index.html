<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>KODOK — Neon Doom</title>
<style>html,body{margin:0;padding:0;background:#050510;overflow:hidden;font-family:'Press Start 2P',monospace}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div id="start-screen">
  <h1>KODOK</h1>
  <p>TAP TO START</p>
</div>

<script>
// ── scene + renderer (built once) ──────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060718);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ── lights & floor ────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0x44aaff, 0x113355, 0.2));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(-6, 18, -4); scene.add(dl);

// neon grid floor
const floorGeo = new THREE.PlaneGeometry(90, 90);
const floorMat = new THREE.MeshBasicMaterial({color:0x221a3d});
scene.add(floorGeo.rotateX(-Math.PI/2));

// ── obstacles (wireframe cubes for neon look) ────────────────
for(let i=0;i<14;i++){
  const g = new THREE.BoxGeometry(3.5,5+Math.random()*6,2);
  scene.add(g);
}

// ── enemy + particle meshes (created once) ───────────────────
const enemies = [];
for(let i=0;i<8;i++){
  const e = new THREE.Mesh(new THREE.BoxGeometry(1.5,3,1.5));
  scene.add(e);
}

// ── game state ────────────────────────────────────────────────
let gameActive = false;
const keys = {w:false,s:false,a:false,d:false};

function startGame(){
  document.getElementById('start-screen').style.display='none';
  gameActive = true;
}

// mobile-first: tap anywhere to launch the game loop
document.addEventListener('click', function(e){ e.preventDefault(); if(!gameActive) startGame(); }, false);

let yawAxis=0, dx=0, dy=0;

function loop(){
  if (!gameActive) return;
  // rotate enemies & particles for "alive" feel
  for(let i=0;i<8;i++) scene.children[i+3].rotation.x += 0.15;
  renderer.render(scene, scene.camera);
  requestAnimationFrame(loop);
}

// camera setup after a tiny delay to ensure Three.js is ready
setTimeout(function(){
  const cam = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
  cam.position.set(-6,3.5,-4);
  scene.camera = cam;

  if (!gameActive) startGame();
}, 500);
</script>
</body>
</html>
