name: fix-mobile-strafe

on:
  push:
    branches: [2026revamp-world-dev]
    paths: [.github/workflows/fix-mobile-strafe.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2026revamp-world-dev
      - name: Invert mobile strafe axis only
        shell: python
        run: |
          from pathlib import Path
          p = Path('2026revamp/world/world.js')
          s = p.read_text()
          old = "if(coarsePointer){strafe+=moveTouch.x;forward+=-moveTouch.y;}"
          new = "if(coarsePointer){strafe+=-moveTouch.x;forward+=-moveTouch.y;}"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one mobile movement mapping, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          wf = Path('.github/workflows/fix-mobile-strafe.yml')
          if wf.exists(): wf.unlink()
      - name: Verify
        run: |
          node --check 2026revamp/world/world.js
          grep -Fq 'strafe+=-moveTouch.x;forward+=-moveTouch.y' 2026revamp/world/world.js
      - name: Commit
        run: |
          git config user.name "Decentricity World Fix"
          git config user.email "1@decentri.city"
          git add -A
          git commit -m "Fix mobile world strafe direction"
          git push origin HEAD:2026revamp-world-dev
