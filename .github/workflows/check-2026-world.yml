name: check-2026-world

on:
  push:
    branches: [2026revamp-world-dev]
    paths:
      - '.github/workflows/check-2026-world.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and integration checks
        run: |
          node --check 2026revamp/world-bridge.js
          node --check 2026revamp/world/world.js
          grep -q 'world-bridge.js' 2026revamp/index.html
          grep -q 'decentricity:switch' 2026revamp/world/world.js
          grep -q 'buildHouse' 2026revamp/world/world.js
          grep -q 'buildDistricts' 2026revamp/world/world.js
          test -f 2026revamp/world/index.html
          test -f 2026revamp/world/styles.css
