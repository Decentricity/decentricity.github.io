name: Revamp checkpoint verify
on:
  push:
    branches:
      - 2026revamp-checkpoint-01
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check 2026revamp/checkpoint-projects.js
          node --check 2026revamp/checkpoint-bridge.js
          node --check 2026revamp/app.js
          node --check 2026revamp/hedgeyos.js
          node --check 2026revamp/world-bridge.js
      - name: Check audited graph
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const ctx = { window: { DECENTRI_DATA: { projects: [], families: [] } } };
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('2026revamp/checkpoint-projects.js','utf8'), ctx);
          const d = ctx.window.DECENTRI_DATA;
          if (d.projects.length !== 37) throw new Error(`expected 37 projects, got ${d.projects.length}`);
          for (const id of ['walkgirl','agent1c','keelbase','debio','myriad','realitychain','blocksphere','connectome-mindmeld']) {
            if (!d.projects.some(p => p.id === id)) throw new Error(`missing ${id}`);
          }
          const walkgirl = d.projects.find(p => p.id === 'walkgirl');
          if (!/Orange Pi Zero 2W/.test(walkgirl.summary) || !/Walkman/.test(walkgirl.summary)) throw new Error('Walkgirl description regression');
          if (d.projects.some(p => /walking\/world experiment/i.test(p.summary))) throw new Error('old Walkgirl hallucination still present');
          console.log(`verified ${d.projects.length} audited project entities`);
          NODE
      - name: Check script order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('2026revamp/index.html').read_text()
          names=['projects.js','checkpoint-projects.js','app.js','hedgeyos.js','world-bridge.js','checkpoint-bridge.js']
          pos=[s.index(f'src="{n}"') for n in names]
          assert pos == sorted(pos), pos
          print('script order ok')
          PY
