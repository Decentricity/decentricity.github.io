<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sovereign spl token auto-deployer (solana, devnet)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- single dependency: solana web3 iife -->
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.js"></script>
  <style>
    body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#121212;color:#f0f0f0;padding:2rem}
    input{width:100%;padding:.6rem;margin-top:.5rem;border-radius:8px;border:1px solid #333;background:#181818;color:#eee}
    .status{white-space:pre-wrap;margin-top:1rem;color:#ffea80;word-break:break-all}
    .info{margin-top:1rem;color:#80b3ff;word-break:break-all}
    a{color:#80ff80}
    .muted{color:#9aa}
  </style>
</head>
<body>
  <h2>sovereign spl token auto-deployer</h2>

  <input id="name"    type="text"   placeholder="token name (display only)">
  <input id="symbol"  type="text"   placeholder="token symbol (display only)">
  <input id="supply"  type="text"   placeholder="initial supply (default: 1000000)">
  <input id="decimals" type="number" placeholder="decimals (default: 9)">

  <div id="status" class="status">initializing...</div>

  <div class="info">
    <strong>send sol (devnet) to deploy your token:</strong><br>
    <span id="walletAddress">...</span>
    <div class="muted">ephemeral keypair: lost on refresh (by design)</div>
  </div>

<script>
window.onload = async () => {
  const S = document.getElementById("status");
  const out = (m) => { console.log(m); S.textContent = m; };
  const append = (m) => { console.log(m); S.textContent += "\n" + m; };

  try {
    if (!window.solanaWeb3) { out("❌ solana web3 not loaded"); return; }

    const {
      Connection, Keypair, LAMPORTS_PER_SOL, SystemProgram,
      Transaction, TransactionInstruction, PublicKey
    } = solanaWeb3;

    // program ids (classic spl-token, not token-2022) and constants
    const TOKEN_PROGRAM_ID = new PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA");
    const RENT_SYSVAR_ID   = new PublicKey("SysvarRent111111111111111111111111111111111");
    const MINT_SIZE = 82;   // spl mint account size
    const ACCOUNT_SIZE = 165; // spl token account size

    // helpers (no node Buffer usage)
    const pk32 = (pubkey) => (pubkey.toBytes ? pubkey.toBytes() : Uint8Array.from(pubkey.toBuffer()));

    function encodeInitMint(decimals, mintAuthority, withFreeze=false, freezeAuthority=null){
      // u8:0 (initializeMint) | u8:decimals | [32] mintAuthority | u8:freezeOpt | [32]? freezeAuthority
      const base = 1+1+32+1;
      const out = new Uint8Array(base + (withFreeze?32:0));
      let o=0;
      out[o++] = 0;
      out[o++] = decimals & 0xff;
      out.set(pk32(mintAuthority), o); o+=32;
      out[o++] = withFreeze ? 1 : 0;
      if(withFreeze){ out.set(pk32(freezeAuthority), o); }
      return out;
    }

    function encodeInitializeAccount(){ return new Uint8Array([1]); } // instruction 1
    function encodeMintTo(amount){
      const u = new Uint8Array(1+8);
      u[0]=7; // mintTo
      new DataView(u.buffer).setBigUint64(1, BigInt(amount), true); // little-endian
      return u;
    }

    // minimal bigint decimal parser: "123.45" with dec places -> base units
    function parseAmount(human, dec){
      const clean = String(human).replace(/_/g,'').trim();
      if(!/^[0-9]+(\.[0-9]+)?$/.test(clean)) throw new Error("initial supply must be numeric");
      const [i,f=""] = clean.split(".");
      const frac = (f + "0".repeat(dec)).slice(0, dec);
      return BigInt(i||"0")*(10n**BigInt(dec)) + BigInt(frac||"0");
    }

    // boot connection + ephemeral wallet
    const connection = new Connection("https://api.devnet.solana.com", "confirmed");
    const wallet = Keypair.generate();
    document.getElementById("walletAddress").textContent = wallet.publicKey.toBase58();
    out("✅ wallet: " + wallet.publicKey.toBase58() + "\nwaiting for sol deposit...");

    async function getBalance(){
      try { return (await connection.getBalance(wallet.publicKey))/LAMPORTS_PER_SOL; }
      catch(e){ append("❌ getBalance: " + (e.message||e)); return 0; }
    }

    async function confirm(sig,label){
      try {
        await connection.confirmTransaction({signature:sig}, "confirmed");
        append(`✔ ${label} confirmed: ${sig}`);
      } catch(e) {
        append(`❌ confirm failed (${label}): ${(e.message||e)}`);
      }
    }

    let fired = false;

    async function deploy(){
      fired = true;
      try{
        const name = document.getElementById("name").value || "MyToken";
        const sym  = document.getElementById("symbol").value || "MTK";
        const dec  = parseInt(document.getElementById("decimals").value || "9", 10);
        if(!(dec>=0 && dec<=9)) throw new Error("decimals should be 0..9");
        const amount = parseAmount(document.getElementById("supply").value || "1000000", dec);

        // 1) create + initialize mint
        append("📦 creating mint...");
        const mint = Keypair.generate();
        const rentMint = await connection.getMinimumBalanceForRentExemption(MINT_SIZE);

        let tx1 = new Transaction().add(
          SystemProgram.createAccount({
            fromPubkey: wallet.publicKey,
            newAccountPubkey: mint.publicKey,
            space: MINT_SIZE,
            lamports: rentMint,
            programId: TOKEN_PROGRAM_ID
          }),
          new TransactionInstruction({
            programId: TOKEN_PROGRAM_ID,
            keys: [
              {pubkey: mint.publicKey, isSigner:true,  isWritable:true},
              {pubkey: RENT_SYSVAR_ID, isSigner:false, isWritable:false}
            ],
            data: encodeInitMint(dec, wallet.publicKey, false, null)
          })
        );
        const sig1 = await connection.sendTransaction(tx1, [wallet, mint], {skipPreflight:false});
        await confirm(sig1, "mint init");

        // 2) create a plain token account (no associated-token program; fewer edge-cases)
        append("🏦 creating token account...");
        const tokenAcc = Keypair.generate();
        const rentAcc = await connection.getMinimumBalanceForRentExemption(ACCOUNT_SIZE);

        let tx2 = new Transaction().add(
          SystemProgram.createAccount({
            fromPubkey: wallet.publicKey,
            newAccountPubkey: tokenAcc.publicKey,
            space: ACCOUNT_SIZE,
            lamports: rentAcc,
            programId: TOKEN_PROGRAM_ID
          }),
          new TransactionInstruction({
            programId: TOKEN_PROGRAM_ID,
            keys: [
              {pubkey: tokenAcc.publicKey, isSigner:false, isWritable:true}, // account
              {pubkey: mint.publicKey,     isSigner:false, isWritable:false},// mint
              {pubkey: wallet.publicKey,   isSigner:false, isWritable:false},// owner
              {pubkey: RENT_SYSVAR_ID,     isSigner:false, isWritable:false} // rent
            ],
            data: encodeInitializeAccount() // instruction 1
          })
        );
        const sig2 = await connection.sendTransaction(tx2, [wallet, tokenAcc], {skipPreflight:false});
        await confirm(sig2, "token account init");

        // 3) mint to that account
        append("🪙 minting supply...");
        let tx3 = new Transaction().add(
          new TransactionInstruction({
            programId: TOKEN_PROGRAM_ID,
            keys: [
              {pubkey: mint.publicKey,      isSigner:false, isWritable:true}, // mint
              {pubkey: tokenAcc.publicKey,  isSigner:false, isWritable:true}, // dest
              {pubkey: wallet.publicKey,    isSigner:true,  isWritable:false} // mint authority
            ],
            data: encodeMintTo(amount) // instruction 7
          })
        );
        const sig3 = await connection.sendTransaction(tx3, [wallet], {skipPreflight:false});
        await confirm(sig3, "mintTo");

        const expTx = (sig) => `https://explorer.solana.com/tx/${sig}?cluster=devnet`;
        const expAddr = (a) => `https://explorer.solana.com/address/${a}?cluster=devnet`;

        out(`🎉 deployed!
mint: ${mint.publicKey.toBase58()}
mint page: ${expAddr(mint.publicKey.toBase58())}
holder account: ${tokenAcc.publicKey.toBase58()}
holder page: ${expAddr(tokenAcc.publicKey.toBase58())}
txs:
- mint init: ${expTx(sig1)}
- account init: ${expTx(sig2)}
- mintTo: ${expTx(sig3)}
meta: ${name} (${sym}), decimals=${dec}`);
      }catch(e){
        const logs = e && e.logs ? `\nlogs:\n${e.logs.join("\n")}` : "";
        out("❌ deploy error: " + (e.message||e) + logs);
      }
    }

    // poll for funds then deploy
    setInterval(async () => {
      if (fired) return;
      try{
        const bal = await getBalance();
        if (bal > 0) { out(`💰 received ${bal} sol — deploying...`); deploy(); }
      }catch(e){ append("poll error: " + (e.message||e)); }
    }, 12000);

  } catch(e) {
    out("❌ fatal: " + (e.message||e));
  }
};
</script>
</body>
</html>
