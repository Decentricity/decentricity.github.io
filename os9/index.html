<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OS9-ish UI + Menubar WM</title>

  <style>
    :root{
      /* sizing */
      --font-size: clamp(12px, 2.8vw, 14px);
      --line: clamp(16px, 3.4vw, 18px);
      --pad: clamp(8px, 2.2vw, 18px);
      --menubar-h: 26px;

      /* light theme */
      --os-bg: #c9c9c9;
      --os-face: #d7d7d7;
      --os-face2: #ededed;
      --os-shadow: #7b7b7b;
      --os-dark: #3b3b3b;
      --os-white: #ffffff;
      --os-black: #000000;
      --os-blue: #2a66b7;

      --menubar-top: #e8e8e8;
      --menubar-bot: #d6d6d6;

      --titlebar-top: #e6e6e6;
      --titlebar-bot: #cfcfcf;

      --chrome-top: #e8e8e8;
      --chrome-bot: #d6d6d6;

      --inactive-top: #dddddd;
      --inactive-bot: #c7c7c7;

      --border-thin: 1px;
      --border-thick: 2px;
    }

    body.dark{
      --os-bg: #1f232a;
      --os-face: #2c313a;
      --os-face2: #252a33;
      --os-shadow: #0f1217;
      --os-dark: #cfd6e6;
      --os-white: #515b6b;
      --os-black: #eef2ff;
      --os-blue: #4c84d6;

      --menubar-top: #3a404b;
      --menubar-bot: #2a2f38;

      --titlebar-top: #3a404b;
      --titlebar-bot: #2f343f;

      --chrome-top: #3a404b;
      --chrome-bot: #2a2f38;

      --inactive-top: #323846;
      --inactive-bot: #2a2f38;
    }

    @font-face{
      font-family: "ChicagoKare";
      src: url("fonts/ChicagoKare-Regular.woff2") format("woff2");
      font-display: swap;
    }

    html, body { height: 100%; }
    body{
      margin: 0;
      background: var(--os-bg);
      color: var(--os-black);
      font-family: "ChicagoKare","ChiKareGo2Web","Chicago","Charcoal","Geneva","Tahoma",system-ui,sans-serif;
      font-size: var(--font-size);
      line-height: var(--line);
      -webkit-font-smoothing: none;
      font-smooth: never;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .bevel-out{
      background: var(--os-face);
      border-top: var(--border-thin) solid var(--os-white);
      border-left: var(--border-thin) solid var(--os-white);
      border-right: var(--border-thin) solid var(--os-shadow);
      border-bottom: var(--border-thin) solid var(--os-shadow);
    }
    .bevel-out.thick{
      border-top: var(--border-thick) solid var(--os-white);
      border-left: var(--border-thick) solid var(--os-white);
      border-right: var(--border-thick) solid var(--os-shadow);
      border-bottom: var(--border-thick) solid var(--os-shadow);
    }
    .bevel-in{
      background: var(--os-face2);
      border-top: var(--border-thin) solid var(--os-shadow);
      border-left: var(--border-thin) solid var(--os-shadow);
      border-right: var(--border-thin) solid var(--os-white);
      border-bottom: var(--border-thin) solid var(--os-white);
    }
    .hairline{
      outline: 1px solid var(--os-dark);
      outline-offset: -1px;
    }

    /* ===== Menu bar ===== */
    .menubar{
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      height: var(--menubar-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      box-sizing: border-box;
      background: linear-gradient(var(--menubar-top), var(--menubar-bot));
      z-index: 9999;
      user-select: none;
    }

    .menu{
      position: relative;
      display: inline-flex;
      align-items: center;
      height: calc(var(--menubar-h) - 2px);
      padding: 0 6px;
      cursor: default;
      white-space: nowrap;
    }
    .menu.open{
      background: var(--os-blue);
      color: #fff;
    }
    .menu-label{ font-weight: 600; }

    .menu-dropdown{
      position: absolute;
      top: calc(var(--menubar-h) - 2px);
      left: 0;
      min-width: 220px;
      max-height: min(60vh, 520px);
      overflow: auto;
      display: none;
      padding: 2px;
      box-sizing: border-box;
      background: var(--os-face);
      z-index: 10000;
    }
    .menu.open .menu-dropdown{ display: block; }

    .menu-item{
      padding: 4px 10px;
      cursor: default;
      white-space: nowrap;
    }
    .menu-item:hover{
      background: var(--os-blue);
      color: #fff;
    }
    .menu-sep{
      height: 1px;
      background: var(--os-shadow);
      margin: 3px 6px;
    }
    .menu-title{
      font-weight: 600;
      opacity: 0.85;
      pointer-events: none;
    }

    .menubar-spacer{ flex: 1; }

    .modebtn{
      width: 22px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font: inherit;
      font-weight: 700;
      background: var(--os-face);
      border-top: 1px solid var(--os-white);
      border-left: 1px solid var(--os-white);
      border-right: 1px solid var(--os-shadow);
      border-bottom: 1px solid var(--os-shadow);
      box-shadow: inset 0 0 0 1px var(--os-dark);
      cursor: default;
      user-select: none;
    }
    .modebtn:active{
      border-top: 1px solid var(--os-shadow);
      border-left: 1px solid var(--os-shadow);
      border-right: 1px solid var(--os-white);
      border-bottom: 1px solid var(--os-white);
    }

    /* ===== Desktop area ===== */
    .desktop{
      position: absolute;
      top: var(--menubar-h);
      left: 0;
      right: 0;
      bottom: 0;
      padding: var(--pad);
      box-sizing: border-box;
      overflow: hidden;
      touch-action: none;
    }

    /* ===== Windows ===== */
    .window{
      position: absolute;
      min-width: 320px;
      min-height: 240px;
      user-select: none;
      box-sizing: border-box;
      display: grid;
      grid-template-rows: 24px 1fr;
    }

    .window.inactive .titlebar{
      background: linear-gradient(var(--inactive-top), var(--inactive-bot));
      filter: saturate(0.85);
    }
    .window.inactive .titlebar .title:before,
    .window.inactive .titlebar .title:after{
      opacity: 0.55;
    }

    .titlebar{
      height: 24px;
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      align-items: center;
      padding: 0 6px;
      box-sizing: border-box;
      background: linear-gradient(var(--titlebar-top), var(--titlebar-bot));
      cursor: grab;
      touch-action: none;
    }
    .titlebar:active{ cursor: grabbing; }

    .controls{
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-start;
    }

    .os9-box{
      width: 12px;
      height: 12px;
      background: var(--os-face);
      border-top: 1px solid var(--os-white);
      border-left: 1px solid var(--os-white);
      border-right: 1px solid var(--os-shadow);
      border-bottom: 1px solid var(--os-shadow);
      box-shadow: inset 0 0 0 1px var(--os-dark);
      cursor: default;
    }
    .os9-box:active{
      border-top: 1px solid var(--os-shadow);
      border-left: 1px solid var(--os-shadow);
      border-right: 1px solid var(--os-white);
      border-bottom: 1px solid var(--os-white);
    }

    .title{
      position: relative;
      text-align: center;
      font-weight: 600;
      padding: 0 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title:before,
    .title:after{
      content:"";
      position:absolute;
      top: 50%;
      width: 44%;
      height: 10px;
      transform: translateY(-50%);
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.9) 0px,
          rgba(255,255,255,0.9) 1px,
          rgba(123,123,123,0.9) 1px,
          rgba(123,123,123,0.9) 2px
        );
      opacity: 0.9;
    }
    body.dark .title:before,
    body.dark .title:after{
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(220,230,255,0.25) 0px,
          rgba(220,230,255,0.25) 1px,
          rgba(0,0,0,0.35) 1px,
          rgba(0,0,0,0.35) 2px
        );
    }
    .title:before{ left: 0; margin-left: 6px; }
    .title:after{ right: 0; margin-right: 6px; }
    .title > span{
      position: relative;
      padding: 0 10px;
      background: linear-gradient(var(--titlebar-top), var(--titlebar-bot));
    }

    .right{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:6px;
    }

    .resize-grip{
      position: absolute;
      right: 3px;
      bottom: 3px;
      width: 14px;
      height: 14px;
      background:
        repeating-linear-gradient(135deg,
          rgba(255,255,255,0.9) 0px,
          rgba(255,255,255,0.9) 1px,
          rgba(123,123,123,0.9) 1px,
          rgba(123,123,123,0.9) 2px);
      opacity: 0.9;
      cursor: nwse-resize;
      touch-action: none;
    }
    body.dark .resize-grip{
      background:
        repeating-linear-gradient(135deg,
          rgba(220,230,255,0.25) 0px,
          rgba(220,230,255,0.25) 1px,
          rgba(0,0,0,0.35) 1px,
          rgba(0,0,0,0.35) 2px);
    }

    /* ===== Finder-ish UI ===== */
    .window-body{
      height: 100%;
      background: var(--os-face);
      display: grid;
      grid-template-columns: 220px 1fr;
      min-width: 0;
    }

    .sidebar{
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-right: 1px solid var(--os-shadow);
      background: var(--os-face);
      min-width: 0;
    }
    .section-title{
      padding: 8px 10px;
      font-weight: 600;
    }
    .navlist{
      margin: 0;
      padding: 0 6px 10px 6px;
      list-style: none;
      overflow: auto;
      min-width: 0;
    }
    .navitem{
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      cursor: default;
      white-space: nowrap;
    }
    .navitem.active{
      background: var(--os-blue);
      color: #fff;
    }
    .icon{
      width: 14px;
      height: 14px;
      background: #9b9bff;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
      flex: 0 0 auto;
    }

    .main{
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--os-face);
      min-width: 0;
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 6px;
      border-bottom: 1px solid var(--os-shadow);
      background: linear-gradient(var(--chrome-top), var(--chrome-bot));
      flex-wrap: wrap;
    }

    .btn{
      padding: 3px 10px;
      font: inherit;
      background: var(--os-face);
      border-top: 1px solid var(--os-white);
      border-left: 1px solid var(--os-white);
      border-right: 1px solid var(--os-shadow);
      border-bottom: 1px solid var(--os-shadow);
      box-shadow: inset 0 0 0 1px var(--os-dark);
      cursor: default;
    }
    .btn:active{
      border-top: 1px solid var(--os-shadow);
      border-left: 1px solid var(--os-shadow);
      border-right: 1px solid var(--os-white);
      border-bottom: 1px solid var(--os-white);
    }

    .listwrap{
      height: 100%;
      overflow: auto;
      background: var(--os-face2);
      min-width: 0;
    }

    table.list{
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.list thead th{
      position: sticky;
      top: 0;
      z-index: 2;
      background: linear-gradient(var(--chrome-top), var(--chrome-bot));
      border-bottom: 1px solid var(--os-shadow);
      padding: 4px 6px;
      text-align: left;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
    }
    table.list tbody td{
      padding: 4px 6px;
      border-bottom: 1px solid rgba(200,200,200,0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tr.row.selected{
      background: var(--os-blue);
      color: #fff;
    }

    .statusbar{
      padding: 4px 8px;
      border-top: 1px solid var(--os-shadow);
      background: linear-gradient(var(--chrome-top), var(--chrome-bot));
      display:flex;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .statusbar span{
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ===== App iframe window body ===== */
    .appwrap{
      height: 100%;
      background: var(--os-face2);
      overflow: hidden;
    }
    iframe.appframe{
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    /* ===== Responsive tweaks ===== */
    @media (max-width: 760px){
      .window-body{ grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar{
        grid-template-rows: auto auto;
        border-right: 0;
        border-bottom: 1px solid var(--os-shadow);
      }
      .sidebar .statusbar{ display:none; }
      .navlist{
        display:flex;
        gap: 6px;
        overflow-x: auto;
        padding: 0 6px 6px 6px;
      }
      .navitem{ flex: 0 0 auto; }
    }

    @media (max-width: 640px){
      table.list th:nth-child(3),
      table.list td:nth-child(3),
      table.list th:nth-child(4),
      table.list td:nth-child(4){
        display:none;
      }
    }
    @media (max-width: 480px){
      table.list th:nth-child(2),
      table.list td:nth-child(2){
        display:none;
      }
    }
  </style>
</head>

  <script>
    // ===== Menu bar behavior =====
    (function(){
      const menubar = document.getElementById("menubar");
      const menus = Array.from(menubar.querySelectorAll(".menu"));

      function closeAll(){
        menus.forEach(m => m.classList.remove("open"));
      }

      menubar.addEventListener("click", (e) => {
        const menu = e.target.closest(".menu");
        if (!menu) return;

        const already = menu.classList.contains("open");
        closeAll();
        if (!already) menu.classList.add("open");
      });

      document.addEventListener("click", (e) => {
        if (e.target.closest("#menubar")) return;
        closeAll();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAll();
      });
    })();

    // ===== Dark mode // ===== Dark mode toggle =====
    (function(){
      const btn = document.getElementById("modebtn");
      const key = "os9_dark_mode";

      function apply(on){
        document.body.classList.toggle("dark", !!on);
        btn.textContent = on ? "☀" : "☾";
      }

      const saved = localStorage.getItem(key);
      apply(saved === "1");

      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const on = !document.body.classList.contains("dark");
        apply(on);
        localStorage.setItem(key, on ? "1" : "0");
      });
    })();

    // ===== App registry =====
    const APPS = {
      flipsideClassic: { title: "Flipside classic", url: "https://flipside.ink" },
      flipside3d:      { title: "Flipside 3D",      url: "https://cubewalker.berrry.app" },
      unconnectedChat: { title: "Unconnected AI Chat", url: "https://chat.unconnected.ai" },
      hedgeyTown:      { title: "3D Hedgey Town",   url: "https://blueprintwalk.berrry.app/" },
      chordynaut:      { title: "Chordynaut",       url: "https://chordynaut.com" },
      about:           { title: "About",            url: "https://decentricity.github.io" },
    };

    // ===== Tiny WM =====
    const WM = (() => {
      const desktop = document.getElementById("desktop");
      const finderTpl = document.getElementById("finderTemplate");
      const appTpl = document.getElementById("appTemplate");
      const openWindowsList = document.getElementById("openWindowsList");

      let zTop = 20;
      let idSeq = 1;
      const state = new Map(); // id -> { win, minimized, maximized, restoreRect, title }

      function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
      function deskRect(){ return desktop.getBoundingClientRect(); }
      function deskSize(){ return { w: desktop.clientWidth, h: desktop.clientHeight }; }

      function getTitle(win){
        return win.querySelector("[data-titletext]")?.textContent?.trim() || "Window";
      }

      function refreshOpenWindowsMenu(){
        openWindowsList.innerHTML = "";
        const entries = Array.from(state.entries());

        if (!entries.length){
          const empty = document.createElement("div");
          empty.className = "menu-item";
          empty.textContent = "(none)";
          empty.style.pointerEvents = "none";
          empty.style.opacity = "0.75";
          openWindowsList.appendChild(empty);
          return;
        }

        entries.sort((a,b) => {
          const za = parseInt(a[1].win.style.zIndex || "0", 10);
          const zb = parseInt(b[1].win.style.zIndex || "0", 10);
          return zb - za;
        });

        for (const [id, st] of entries){
          const item = document.createElement("div");
          item.className = "menu-item";
          item.textContent = (st.minimized ? "◊ " : "") + st.title;
          item.addEventListener("click", (e) => {
            e.stopPropagation();
            restore(id);
            focus(id);
            document.querySelectorAll("#menubar .menu").forEach(m => m.classList.remove("open"));
          });
          openWindowsList.appendChild(item);
        }
      }

      function focus(id){
        for (const [wid, st] of state.entries()){
          st.win.classList.toggle("inactive", wid !== id);
        }
        const st = state.get(id);
        if (!st) return;
        st.win.style.zIndex = String(++zTop);
        refreshOpenWindowsMenu();
      }

      function minimize(id){
        const st = state.get(id);
        if (!st || st.minimized) return;
        st.minimized = true;
        st.win.style.display = "none";
        refreshOpenWindowsMenu();
      }

      function restore(id){
        const st = state.get(id);
        if (!st || !st.minimized) return;
        st.minimized = false;
        st.win.style.display = "grid";
        refreshOpenWindowsMenu();
      }

      function close(id){
        const st = state.get(id);
        if (!st) return;
        st.win.remove();
        state.delete(id);
        const last = Array.from(state.keys()).pop();
        if (last) focus(last);
        refreshOpenWindowsMenu();
      }

      function applyDefaultSize(win){
        const { w: dw, h: dh } = deskSize();
        const w = Math.max(320, Math.floor(dw * 0.8)); // 4/5 width
        const h = Math.max(240, Math.floor(dh * 0.5)); // half height
        win.style.width = w + "px";
        win.style.height = h + "px";
      }

      function toggleZoom(id){
        const st = state.get(id);
        if (!st) return;

        const { w: dw, h: dh } = deskSize();

        if (!st.maximized){
          const rect = st.win.getBoundingClientRect();
          const dr = deskRect();
          st.restoreRect = {
            left: rect.left - dr.left,
            top: rect.top - dr.top,
            width: rect.width,
            height: rect.height
          };

          const pad = 6;
          st.win.style.left = pad + "px";
          st.win.style.top = pad + "px";
          st.win.style.width = Math.max(320, dw - pad * 2) + "px";
          st.win.style.height = Math.max(240, dh - pad * 2) + "px";

          st.maximized = true;
        } else {
          const r = st.restoreRect;
          if (r){
            st.win.style.left = r.left + "px";
            st.win.style.top = r.top + "px";
            st.win.style.width = r.width + "px";
            st.win.style.height = r.height + "px";
          }
          st.maximized = false;
        }
        focus(id);
      }

      function makeDraggable(id, win){
        const bar = win.querySelector("[data-titlebar]");
        let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;

        win.addEventListener("pointerdown", () => focus(id));

        bar.addEventListener("pointerdown", (e) => {
          const onControl = e.target.closest("[data-close],[data-minimize],[data-zoom]");
          if (onControl) return;
          if (state.get(id)?.maximized) return;

          e.preventDefault();

          dragging = true;
          bar.setPointerCapture(e.pointerId);
          startX = e.clientX;
          startY = e.clientY;

          const rect = win.getBoundingClientRect();
          const dr = deskRect();

          startLeft = rect.left - dr.left;
          startTop  = rect.top - dr.top;
        }, { passive: false });

        bar.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          e.preventDefault();

          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          const { w: dw, h: dh } = deskSize();
          const rect = win.getBoundingClientRect();
          const w = rect.width;
          const h = rect.height;

          const newLeft = clamp(startLeft + dx, 0, dw - w);
          const newTop  = clamp(startTop + dy, 0, dh - h);

          win.style.left = newLeft + "px";
          win.style.top  = newTop + "px";
        }, { passive: false });

        bar.addEventListener("pointerup", () => dragging = false);
        bar.addEventListener("pointercancel", () => dragging = false);

        bar.addEventListener("dblclick", () => toggleZoom(id));
      }

      function makeResizable(id, win){
        const grip = win.querySelector("[data-grip]");
        let resizing = false, startX = 0, startY = 0, startW = 0, startH = 0;

        grip.addEventListener("pointerdown", (e) => {
          if (state.get(id)?.maximized) return;

          e.preventDefault();

          resizing = true;
          grip.setPointerCapture(e.pointerId);
          startX = e.clientX;
          startY = e.clientY;

          const rect = win.getBoundingClientRect();
          startW = rect.width;
          startH = rect.height;
        }, { passive: false });

        grip.addEventListener("pointermove", (e) => {
          if (!resizing) return;
          e.preventDefault();

          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          const rect = win.getBoundingClientRect();
          const dr = deskRect();
          const left = rect.left - dr.left;
          const top  = rect.top - dr.top;

          const { w: dw, h: dh } = deskSize();
          const maxW = dw - left;
          const maxH = dh - top;

          const newW = clamp(startW + dx, 320, maxW);
          const newH = clamp(startH + dy, 240, maxH);

          win.style.width = newW + "px";
          win.style.height = newH + "px";
        }, { passive: false });

        grip.addEventListener("pointerup", () => resizing = false);
        grip.addEventListener("pointercancel", () => resizing = false);
      }

      function wireFinderUI(win){
        const nav = win.querySelector("[data-nav]");
        const list = win.querySelector("[data-list]");
        const status = win.querySelector("[data-status]");

        nav.addEventListener("click", (e) => {
          const li = e.target.closest(".navitem");
          if (!li) return;
          nav.querySelectorAll(".navitem").forEach(x => x.classList.remove("active"));
          li.classList.add("active");
        });

        list.addEventListener("click", (e) => {
          const tr = e.target.closest("tr.row");
          if (!tr) return;
          list.querySelectorAll("tr.row").forEach(r => r.classList.remove("selected"));
          tr.classList.add("selected");
          if (status) status.textContent = "Selected: " + tr.children[0].textContent;
        });

        const newWinBtn = win.querySelector("[data-newwin]");
        if (newWinBtn) newWinBtn.addEventListener("click", () => createFilesWindow());
      }

      function wireAppUI(win, url){
        const iframe = win.querySelector("[data-iframe]");
        iframe.src = url;
      }

      function spawn(tpl, title, extra){
        const id = "w" + (idSeq++);
        const frag = tpl.content.cloneNode(true);
        const win = frag.querySelector("[data-win]");

        win.dataset.id = id;
        win.style.zIndex = String(++zTop);

        applyDefaultSize(win);

        const { w: dw, h: dh } = deskSize();
        const wNow = parseFloat(win.style.width) || 400;
        const hNow = parseFloat(win.style.height) || 300;

        const pad = 6;
        const baseLeft = pad + 18 * (idSeq - 2);
        const baseTop  = pad + 18 * (idSeq - 2);

        win.style.left = clamp(baseLeft, 0, dw - wNow) + "px";
        win.style.top  = clamp(baseTop, 0, dh - hNow) + "px";

        const titleText = win.querySelector("[data-titletext]");
        if (titleText && title) titleText.textContent = title;

        desktop.appendChild(win);

        const st = { win, minimized: false, maximized: false, restoreRect: null, title: getTitle(win) };
        state.set(id, st);

        win.querySelector("[data-close]").addEventListener("click", () => close(id));
        win.querySelector("[data-minimize]").addEventListener("click", () => minimize(id));
        win.querySelector("[data-zoom]").addEventListener("click", () => toggleZoom(id));

        makeDraggable(id, win);
        makeResizable(id, win);

        if (tpl === finderTpl) wireFinderUI(win);
        if (tpl === appTpl) wireAppUI(win, extra?.url || "about:blank");

        st.title = getTitle(win);
        focus(id);
        refreshOpenWindowsMenu();

        return id;
      }

      function createFilesWindow(){
        return spawn(finderTpl, "Files");
      }

      function createAppWindow(appKey){
        const app = APPS[appKey];
        if (!app) return null;
        return spawn(appTpl, app.title, { url: app.url });
      }

      window.addEventListener("resize", () => {
        const { w: dw, h: dh } = deskSize();
        const dr = deskRect();

        for (const [, st] of state.entries()){
          if (st.minimized) continue;

          const win = st.win;
          const rect = win.getBoundingClientRect();
          const left = rect.left - dr.left;
          const top  = rect.top - dr.top;

          win.style.left = clamp(left, 0, dw - rect.width) + "px";
          win.style.top  = clamp(top, 0, dh - rect.height) + "px";
        }

        refreshOpenWindowsMenu();
      });

      return {
        createFilesWindow,
        createAppWindow,
        refreshOpenWindowsMenu
      };
    })();

    // ===== Menu actions =====
    (function(){
      document.getElementById("menubar").addEventListener("click", (e) => {
        const action = e.target.getAttribute("data-action");
        const app = e.target.getAttribute("data-app");

        if (action === "aboutSystem"){
          WM.createAppWindow("about");
        }
        if (action === "newFiles"){
          WM.createFilesWindow();
        }

        if (app === "files"){
          WM.createFilesWindow();
        } else if (app && APPS[app]){
          WM.createAppWindow(app);
        }

        if (e.target.closest("#appsMenu")){
          WM.refreshOpenWindowsMenu();
        }

        if (action || app) e.stopPropagation();
      });

      // Boot: one Files window
      WM.createFilesWindow();
    })();
  </script>
</body>
</html>
