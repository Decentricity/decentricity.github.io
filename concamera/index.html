<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f312f">
    <meta
      name="description"
      content="ConCamera captures a real photograph and renders local CNN semantic overlays over it."
    >
    <title>ConCamera</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell" id="app-shell" data-view="camera" aria-label="ConCamera prototype">
      <section id="camera-view" class="primary-view camera-view" aria-label="Camera">
        <div class="camera-stage">
      <section class="camera-shell" aria-label="ConCamera body">
        <div class="camera-top-plate">
          <button
            id="viewfinder"
            class="optical-viewfinder"
            type="button"
            aria-expanded="false"
            aria-controls="debug-panel"
            aria-label="Open camera context information"
          >
            <video
              id="camera-preview"
              class="camera-preview"
              autoplay
              muted
              playsinline
              aria-hidden="true"
            ></video>
            <span class="eyepiece-glass" aria-hidden="true"></span>
            <span class="eyepiece-reflection" aria-hidden="true"></span>
          </button>
          <button
            id="camera-switch"
            class="camera-switch"
            type="button"
            aria-label="Switch to front camera"
            aria-pressed="false"
            data-camera-facing="environment"
          >
            <span aria-hidden="true"></span>
          </button>
          <div class="top-identity">
            <span class="brand-mark">CONCAMERA</span>
            <span class="body-code">CC-00</span>
          </div>
          <div class="queue-status" id="developing" aria-live="polite">READY</div>
          <button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen" aria-pressed="false">
            <span aria-hidden="true"></span>
          </button>
          <button class="shutter" id="shutter" type="button" aria-label="Press shutter">
            <span class="shutter-inner" aria-hidden="true"></span>
          </button>
        </div>

        <section class="camera-back-door" aria-label="Camera back">
          <div class="back-service-row">
            <span class="rewind-knob" aria-hidden="true"></span>
            <div class="back-engraving" aria-hidden="true">
              <span>REAL INPUT</span>
              <span>LOCAL VISION</span>
            </div>
            <span class="top-status-marks" aria-hidden="true">CNN REL</span>
          </div>

          <section
            class="debug-panel hidden"
            id="debug-panel"
            aria-label="Camera context information"
            hidden
          >
            <div class="debug-panel-top">
              <span class="lcd-title">SERVICE DATA</span>
              <span class="lcd-icons">
                <span class="battery-shell" aria-hidden="true"><span id="battery-fill" class="battery-fill"></span></span>
                <span id="battery-label">--%</span>
              </span>
            </div>
          <dl class="readout" id="context-readout"></dl>
          </section>

          <div class="film-door-panel">
            <span class="film-door-seam" aria-hidden="true"></span>
            <span class="film-door-hinge" aria-hidden="true"></span>

        <section class="manual-controls semantic-controls" id="manual-controls" aria-label="Semantic overlay controls">
          <div class="analog-dial lens-dial" data-dial="domain" tabindex="0" role="group" aria-label="Lens domain dial">
            <span class="engraved-label">LENS</span>
            <span class="dial-index" aria-hidden="true"></span>
            <div class="dial-face dial-scale" data-dial-face>
              <button type="button" data-domain="general" style="--tick-angle: -125deg">GEN</button>
              <button type="button" data-domain="urban" style="--tick-angle: -75deg">URB</button>
              <button type="button" data-domain="nature" style="--tick-angle: -25deg">NAT</button>
              <button type="button" data-domain="tech" style="--tick-angle: 25deg">TECH</button>
              <button type="button" data-domain="vehicle" style="--tick-angle: 75deg">VEH</button>
              <button type="button" data-domain="food" style="--tick-angle: 125deg">FOOD</button>
              <span class="dial-grip dial-rotor" aria-hidden="true"></span>
            </div>
          </div>

          <div class="control-cluster analysis-control-panel">
            <span class="engraved-label">MODE</span>
            <button
              class="analysis-cycle-button"
              type="button"
              data-control="analysis-mode-cycle"
              data-selected="taxonomy"
              aria-label="Analysis mode: TAXONOMY. Press to change mode."
            >
              <span class="analysis-icon" data-analysis-icon="taxonomy" aria-hidden="true">
                <svg viewBox="0 0 64 64"><path d="M10 14h18v18H10zM36 14h18v18H36zM10 40h18v10H10zM36 40h18v10H36z"></path></svg>
              </span>
              <span class="analysis-icon" data-analysis-icon="semantic" aria-hidden="true" hidden>
                <svg viewBox="0 0 64 64"><circle cx="16" cy="32" r="8"></circle><circle cx="48" cy="18" r="8"></circle><circle cx="48" cy="46" r="8"></circle><path d="M23 29 41 21l2 5-18 8zM24 35l18 8-2 5-18-8z"></path></svg>
              </span>
              <span class="analysis-icon" data-analysis-icon="affordance" aria-hidden="true" hidden>
                <svg viewBox="0 0 64 64"><path d="M30 8h8v22h14L28 58l6-22H18z"></path></svg>
              </span>
              <span class="analysis-icon" data-analysis-icon="risk" aria-hidden="true" hidden>
                <svg viewBox="0 0 64 64"><path d="M32 6 60 56H4z"></path><path d="M29 22h6v17h-6zM29 44h6v6h-6z" fill="#10120f"></path></svg>
              </span>
              <span class="analysis-icon" data-analysis-icon="attention" aria-hidden="true" hidden>
                <svg viewBox="0 0 64 64"><path d="M29 5h6v12h-6zM29 47h6v12h-6zM5 29h12v6H5zM47 29h12v6H47z"></path><circle cx="32" cy="32" r="12"></circle></svg>
              </span>
              <span class="analysis-label" data-analysis-label aria-live="polite">TAXONOMY</span>
            </button>
          </div>

          <div class="semantic-stack">
            <div class="mechanical-lever overlay-panel" data-control="overlay-density" role="radiogroup" aria-label="Overlay density selector">
              <span class="engraved-label">OVERLAY</span>
              <div class="three-track overlay-track">
                <button type="button" data-overlay-density="minimal">MIN</button>
                <button type="button" data-overlay-density="normal">NORM</button>
                <button type="button" data-overlay-density="full">FULL</button>
                <span class="three-thumb" aria-hidden="true"></span>
              </div>
            </div>

            <div class="semantic-switch-row">
              <div class="mechanical-lever compact-switch" data-control="relations-visible" role="radiogroup" aria-label="Relations switch">
                <span class="engraved-label">REL</span>
                <div class="lever-track">
                  <button type="button" data-relations-visible="false">OFF</button>
                  <button type="button" data-relations-visible="true">ON</button>
                  <span class="lever-thumb" aria-hidden="true"></span>
                </div>
              </div>
              <div class="mechanical-lever compact-switch" data-control="boxes-visible" role="radiogroup" aria-label="Boxes switch">
                <span class="engraved-label">BOX</span>
                <div class="lever-track">
                  <button type="button" data-boxes-visible="false">OFF</button>
                  <button type="button" data-boxes-visible="true">ON</button>
                  <span class="lever-thumb" aria-hidden="true"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="analog-dial confidence-dial" data-dial="confidence" tabindex="0" role="group" aria-label="Confidence threshold dial">
            <span class="engraved-label">CONF</span>
            <span class="dial-index" aria-hidden="true"></span>
            <div class="dial-face dial-scale" data-dial-face>
              <button type="button" data-confidence="30" style="--tick-angle: -120deg">30</button>
              <button type="button" data-confidence="40" style="--tick-angle: -80deg">40</button>
              <button type="button" data-confidence="50" style="--tick-angle: -40deg">50</button>
              <button type="button" data-confidence="60" style="--tick-angle: 0deg">60</button>
              <button type="button" data-confidence="70" style="--tick-angle: 40deg">70</button>
              <button type="button" data-confidence="80" style="--tick-angle: 80deg">80</button>
              <button type="button" data-confidence="90" style="--tick-angle: 120deg">90</button>
              <span class="dial-grip dial-rotor" aria-hidden="true"></span>
            </div>
          </div>

          <div class="mechanical-lever scan-panel" data-control="scan-mode" role="radiogroup" aria-label="Scan selector">
            <span class="engraved-label">SCAN</span>
            <div class="three-track scan-track">
              <button type="button" data-scan-mode="focus">FOCUS</button>
              <button type="button" data-scan-mode="balanced">BAL</button>
              <button type="button" data-scan-mode="survey">SURVEY</button>
              <span class="three-thumb" aria-hidden="true"></span>
            </div>
          </div>

          <div class="mechanical-lever view-panel" data-control="view-mode" role="radiogroup" aria-label="Live or freeze view selector">
            <span class="engraved-label">VIEW</span>
            <div class="lever-track">
              <button type="button" data-view-mode="live">LIVE</button>
              <button type="button" data-view-mode="freeze">FREEZE</button>
              <span class="lever-thumb" aria-hidden="true"></span>
            </div>
          </div>
        </section>

        <fieldset class="indoor-toggle" aria-label="Indoor or outdoor">
          <legend class="sr-only">Indoor or outdoor</legend>
          <input type="radio" id="mode-outdoor" name="scene-mode" value="outdoor" checked>
          <label for="mode-outdoor">Outdoor</label>
          <input type="radio" id="mode-indoor" name="scene-mode" value="indoor">
          <label for="mode-indoor">Indoor</label>
        </fieldset>

            <div class="film-output-slot" aria-hidden="true">
              <span></span>
            </div>
          </div>
        </section>

        <figure class="instant-reveal hidden" id="instant-reveal" aria-live="polite">
          <img class="latest-frame hidden" id="latest-frame" alt="Latest ConCamera semantic overlay frame">
        </figure>
      </section>

        </div>
      </section>

      <section id="film-view" class="primary-view film-view" aria-label="Film roll" aria-hidden="true">
      <section class="film-rack" aria-label="Film strip">
        <div class="film-rack-top">
          <span>FILM</span>
          <button class="json-button" id="export-json" type="button">JSON</button>
        </div>
        <div class="film-scroll">
          <ol class="film-strip" id="film-strip"></ol>
        </div>
      </section>
      <section
        id="film-zoom"
        class="film-zoom hidden"
        aria-label="Selected film frame"
        hidden
      >
        <div class="film-zoom-actions">
          <button id="film-zoom-close" class="film-zoom-close" type="button" aria-label="Close enlarged film frame">BACK</button>
          <button id="film-zoom-save" class="film-zoom-save" type="button">SAVE</button>
        </div>
        <figure class="film-zoom-card">
          <img id="film-zoom-image" alt="Enlarged ConCamera semantic overlay frame">
          <figcaption>
            <time id="film-zoom-time"></time>
          </figcaption>
        </figure>
      </section>
      </section>

      <button
        id="view-toggle"
        class="view-toggle"
        type="button"
        aria-label="Open film roll"
        aria-controls="film-view"
        aria-pressed="false"
      >
        <span class="view-toggle-film" aria-hidden="true"></span>
        <span class="view-toggle-camera" aria-hidden="true"></span>
      </button>
    </main>

    <script type="module" src="./assets/main.js"></script>
  </body>
</html>
