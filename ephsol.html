<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ephemeral solana wallet (devnet)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- deps: solana web3 iife + tiny qrcode lib -->
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{--bg:#121212;--fg:#eaeaea;--muted:#9aa;--accent:#80b3ff;--ok:#33d17a;--warn:#ffd479}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wrap{max-width:820px;margin:0 auto;padding:20px}
    h1{font-size:22px;margin:8px 0 16px}
    fieldset{border:1px solid #2a2a2a;border-radius:12px;padding:14px;margin:12px 0}
    legend{padding:0 6px;color:#bbb}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    input,button,select{width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#181818;color:var(--fg);font-family:inherit}
    button{cursor:pointer}
    button.primary{background:#1f2937;border-color:#1f2937}
    button.primary:hover{filter:brightness(1.1)}
    .mono{font-family:inherit;word-break:break-all}
    .muted{color:var(--muted)}
    .status{white-space:pre-wrap;color:var(--warn);margin-top:8px}
    .ok{color:var(--ok)}
    .accent{color:var(--accent)}
    .grid{display:grid;gap:10px}
    #qrcode > canvas{width:180px;height:180px}
    .pill{display:inline-block;padding:2px 8px;border:1px solid #333;border-radius:999px;margin-left:6px}
    .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .small{font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ephemeral solana wallet <span class="pill small">devnet</span></h1>

    <fieldset>
      <legend>wallet</legend>
      <div class="grid">
        <div id="qrcode"></div>
        <div class="grid">
          <div class="mono" id="pub">address: —</div>
          <div class="flex">
            <button id="copyAddr">copy address</button>
            <button id="rekey">new wallet</button>
            <button id="reconnect">reconnect rpc</button>
            <label class="small"><input type="checkbox" id="showSk"> show secret key (base58)</label>
          </div>
          <div class="mono muted" id="sk" style="display:none;">sk: —</div>
          <div class="mono">balance: <span id="bal">0</span> SOL</div>
          <div class="muted small">send devnet sol to the qr or address above; page auto-detects incoming funds.</div>
        </div>
      </div>
      <div class="status" id="status">booting…</div>
    </fieldset>

    <fieldset>
      <legend>send sol</legend>
      <div class="grid">
        <input id="to" placeholder="recipient address (base58)">
        <div class="row">
          <input id="amt" placeholder="amount in SOL (e.g., 0.1)">
          <div class="flex">
            <button id="max">max</button>
            <button id="send" class="primary">send</button>
          </div>
        </div>
        <div class="mono muted small" id="lastTx">last tx: —</div>
      </div>
    </fieldset>

    <fieldset>
      <legend>tools</legend>
      <div class="row">
        <button id="faucet">open faucet</button>
        <button id="viewAddr">view wallet in explorer</button>
      </div>
    </fieldset>
  </div>

<script>
(function(){
  const S = document.getElementById('status');
  const setStatus = (m,cls='') => { S.className='status '+cls; S.textContent = m; console.log(m); };
  const append = (m) => { S.textContent += "\n"+m; console.log(m); };

  // web3 handles
  const { Connection, Keypair, SystemProgram, Transaction, LAMPORTS_PER_SOL, PublicKey } = solanaWeb3;
  let connection = new Connection("https://api.devnet.solana.com", "confirmed");
  let keypair = Keypair.generate();
  let polling = null;

  // elements
  const pubEl = document.getElementById('pub');
  const balEl = document.getElementById('bal');
  const qrcodeEl = new QRCode(document.getElementById('qrcode'), { text: "solana:"+keypair.publicKey.toBase58(), width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
  const skToggle = document.getElementById('showSk');
  const skEl = document.getElementById('sk');

  function renderWallet(){
    const addr = keypair.publicKey.toBase58();
    pubEl.textContent = "address: " + addr;
    qrcodeEl.clear(); qrcodeEl.makeCode("solana:"+addr);
    if (skToggle.checked) {
      skEl.style.display = '';
      skEl.textContent = "sk: " + bs58encode(keypair.secretKey);
    } else {
      skEl.style.display = 'none';
    }
    document.getElementById('viewAddr').onclick = () => window.open(`https://explorer.solana.com/address/${addr}?cluster=devnet`, "_blank");
  }

  // tiny base58 encode (browser-safe)
  const BASE58_ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
  function bs58encode(bytes){
    // minimal base58 for small ui, not optimized
    let x = BigInt(0);
    for (let b of bytes) { x = (x << 8n) + BigInt(b); }
    let out = "";
    while (x > 0) {
      const mod = x % 58n;
      out = BASE58_ALPHABET[Number(mod)] + out;
      x = x / 58n;
    }
    // leading zero bytes => leading '1'
    let leadingZeros = 0;
    for (let b of bytes) { if (b === 0) leadingZeros++; else break; }
    return "1".repeat(leadingZeros) + (out || "1");
  }

  async function refreshBalance(){
    try{
      const lam = await connection.getBalance(keypair.publicKey);
      const sol = (lam / LAMPORTS_PER_SOL).toFixed(9).replace(/0+$/,'').replace(/\.$/,'');
      balEl.textContent = sol;
      return lam;
    }catch(e){
      setStatus("❌ getBalance error: " + (e.message||e));
      return 0;
    }
  }

  function startPolling(){
    if (polling) clearInterval(polling);
    polling = setInterval(async () => {
      const lam = await refreshBalance();
      if (lam > 0) setStatus("💰 funds detected. ready.", "ok");
    }, 8000);
  }

  function parseSolToLamports(str){
    const s = (str||"").trim();
    if(!/^[0-9]+(\.[0-9]+)?$/.test(s)) throw new Error("amount must be numeric");
    const [i,f=""] = s.split(".");
    const frac = (f + "0".repeat(9)).slice(0,9);
    return BigInt(i||"0")*1_000_000_000n + BigInt(frac||"0");
  }

  async function sendSol(){
    try{
      setStatus("⏳ preparing tx…");
      const toStr = document.getElementById('to').value.trim();
      if(!toStr) throw new Error("recipient address required");
      let toPub;
      try { toPub = new PublicKey(toStr); } catch { throw new Error("invalid recipient address"); }

      const lamports = parseSolToLamports(document.getElementById('amt').value || "0");
      if (lamports <= 0n) throw new Error("amount must be > 0");

      const tx = new Transaction().add(SystemProgram.transfer({
        fromPubkey: keypair.publicKey,
        toPubkey: toPub,
        lamports: Number(lamports) // safe up to ~9e18; ui amounts are small
      }));

      const sig = await connection.sendTransaction(tx, [keypair], {skipPreflight:false});
      setStatus("🚀 sent. awaiting confirmation…");
      await connection.confirmTransaction({signature:sig}, "confirmed");
      setStatus("✅ transfer confirmed: " + sig, "ok");
      document.getElementById('lastTx').textContent = "last tx: https://explorer.solana.com/tx/" + sig + "?cluster=devnet";
      refreshBalance();
    }catch(e){
      setStatus("❌ send error: " + (e.message||e));
    }
  }

  // ui hooks
  document.getElementById('copyAddr').onclick = async () => {
    try{
      await navigator.clipboard.writeText(keypair.publicKey.toBase58());
      setStatus("📋 address copied", "ok");
    }catch{ setStatus("❌ clipboard blocked"); }
  };

  document.getElementById('rekey').onclick = async () => {
    keypair = Keypair.generate();
    renderWallet();
    setStatus("🔐 new ephemeral wallet generated. waiting for funds…");
    refreshBalance();
  };

  document.getElementById('reconnect').onclick = () => {
    connection = new Connection("https://api.devnet.solana.com", "confirmed");
    setStatus("🔄 reconnected rpc.");
    refreshBalance();
  };

  document.getElementById('send').onclick = sendSol;

  document.getElementById('max').onclick = async () => {
    try{
      const lam = await connection.getBalance(keypair.publicKey);
      // leave a tiny fee buffer (5000 lamports)
      const lamSend = lam > 5000 ? lam - 5000 : 0;
      const sol = (lamSend/ LAMPORTS_PER_SOL).toFixed(9);
      document.getElementById('amt').value = sol;
    }catch(e){ setStatus("❌ max error: " + (e.message||e)); }
  };

  document.getElementById('faucet').onclick = () => window.open("https://faucet.solana.com/", "_blank");
  skToggle.onchange = renderWallet;

  // boot
  renderWallet();
  refreshBalance();
  startPolling();
  setStatus("✅ wallet ready. waiting for funds…", "ok");
})();
</script>
</body>
</html>
