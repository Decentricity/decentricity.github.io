<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ubuntu Training Slides</title>
  <style>
    :root {
      --bg1: #fff7fb;
      --bg2: #ffeaf4;
      --bg3: #ffe1ef;
      --panel: #fff9fd;
      --text: #5b3a4c;
      --muted: #8f6680;
      --accent: #e98ab7;
      --accent-2: #d86ca2;
      --line: #f3c8dd;
      --code-bg: #fff3fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, #ffeef7 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, #ffe3f0 0%, transparent 35%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 249, 253, 0.82);
      backdrop-filter: blur(4px);
    }

    .deck-title {
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .counter {
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .slide {
      width: min(980px, 96vw);
      height: min(74vh, 720px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(1rem, 2vw, 2rem);
      box-shadow: 0 10px 30px rgba(216, 108, 162, 0.14);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 3.1vw, 2rem);
      color: var(--accent-2);
      line-height: 1.25;
    }

    .explanation {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.45;
      color: var(--text);
    }

    pre {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--code-bg);
      padding: 0.9rem;
      overflow: auto;
      font-size: 0.92rem;
      line-height: 1.35;
      color: #6a2f4d;
    }

    code {
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      white-space: pre;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.55rem;
      padding: 0.8rem 1rem 1rem;
      border-top: 1px solid var(--line);
      background: rgba(255, 249, 253, 0.78);
      backdrop-filter: blur(4px);
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 0.5rem 0.85rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 64px;
    }

    button:hover { background: #fff3fa; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .hint {
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .progress {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 4px;
      background: #f6d9e8;
    }

    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 180ms ease;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="deck-title" id="deck-title">Ubuntu Training Deck</div>
    <div class="counter" id="counter">0 / 0</div>
  </header>

  <main>
    <section class="slide" aria-live="polite">
      <h1 id="slide-title"></h1>
      <p id="slide-explanation" class="explanation"></p>
      <pre id="slide-code-wrap"><code id="slide-code"></code></pre>
    </section>
  </main>

  <footer class="controls">
    <button id="first" type="button">|&lt;</button>
    <button id="prev" type="button">&lt;</button>
    <button id="next" type="button">&gt;</button>
    <button id="last" type="button">&gt;|</button>
    <div class="hint">Use Left/Right arrow keys, Home/End, or buttons.</div>
  </footer>

  <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>

  <textarea id="slide-source" hidden>
[Slide 1 - Performance triage mindset]
[First classify the bottleneck domain (CPU, memory, disk, network) before tuning; random tweaks waste time.]
```bash
date
uptime
```

[Slide 2 - Load average vs CPU usage]
[Load average is runnable or waiting tasks, not direct CPU percent; high load with low CPU often means I/O wait.]
```bash
uptime
mpstat 1 5
```

[Slide 3 - Fast system snapshot]
[Capture one baseline snapshot with host, kernel, uptime, memory, and disk to anchor all later comparisons.]
```bash
hostnamectl
free -h
df -h
```

[Slide 4 - top and htop essentials]
[Sort by CPU or memory and inspect process states to identify immediate top offenders.]
```bash
top -o %CPU
htop
```

[Slide 5 - CPU bottleneck indicators]
[Look for sustained high user/system CPU, run queue growth, and hot processes pinned across cores.]
```bash
mpstat -P ALL 1 5
ps -eo pid,comm,%cpu --sort=-%cpu | head
```

[Slide 6 - Context switches and run queue]
[Excessive context switching and long run queues can indicate thread contention or too many runnable tasks.]
```bash
vmstat 1 10
```

[Slide 7 - Memory pressure basics]
[Low free memory is normal on Linux; focus on swap activity, reclaim behavior, and OOM events.]
```bash
free -h
vmstat 1 10
```

[Slide 8 - Detect OOM and reclaim pain]
[Kernel logs reveal OOM kills and memory pressure that user-space tools may miss.]
```bash
dmesg -T | grep -Ei 'out of memory|oom|killed process' | tail -n 20
journalctl -k --since "1 hour ago" --no-pager
```

[Slide 9 - Disk capacity vs disk performance]
[Separate full-disk incidents from slow-disk incidents; both break apps but need different fixes.]
```bash
df -h
lsblk -o NAME,FSTYPE,SIZE,MOUNTPOINT,ROTA
```

[Slide 10 - Disk I/O saturation]
[Use `iostat` to detect high utilization and await times indicating storage queue congestion.]
```bash
iostat -xz 1 10
```

[Slide 11 - Process-level I/O culprits]
[Identify which processes generate the most read/write pressure before changing storage config.]
```bash
sudo iotop -oPa
pidstat -d 1 5
```

[Slide 12 - Network triage quick checks]
[Start with socket states and interface counters to distinguish app issues from transport issues.]
```bash
ss -s
ip -s link
```

[Slide 13 - Connection-level inspection]
[Find backlog, retransmits, and anomalous connection growth during service degradation.]
```bash
ss -tuna | head -n 30
ss -lntp
```

[Slide 14 - DNS and latency sanity checks]
[Slow DNS resolution often looks like random app slowness; test name lookup and endpoint latency directly.]
```bash
resolvectl status
getent hosts example.com
ping -c 4 8.8.8.8
```

[Slide 15 - Kernel signal correlation]
[Correlate spikes with kernel warnings: NIC resets, filesystem errors, soft lockups, or cgroup throttling.]
```bash
journalctl -k --since "30 minutes ago" --no-pager | tail -n 100
```

[Slide 16 - Service-level perspective]
[Host metrics are incomplete without service health, restart loops, and application-level error rate context.]
```bash
systemctl --failed
systemctl status nginx --no-pager
journalctl -u nginx --since "30 minutes ago" --no-pager | tail -n 50
```

[Slide 17 - Bottleneck decision tree]
[Decision pattern: high CPU busy -> CPU path; high await -> disk path; swap/OOM -> memory path; retransmits/timeouts -> network path.]
```bash
# CPU: mpstat, top
# MEM: free, vmstat, dmesg
# DISK: iostat, iotop
# NET: ss, ip -s link
```

[Slide 18 - Safe immediate mitigations]
[Apply reversible mitigations first: restart stuck service, free disk, scale workers, or rate-limit abusive traffic.]
```bash
sudo systemctl restart myservice
sudo journalctl --vacuum-time=7d
sudo ufw limit 443/tcp
```

[Slide 19 - Capture evidence for postmortem]
[During incidents, gather timestamped command output so root cause analysis is based on facts, not memory.]
```bash
ts=$(date +%F_%H%M%S)
mkdir -p /tmp/perf-$ts
( uptime; free -h; df -h; ss -s; vmstat 1 5 ) | tee /tmp/perf-$ts/snapshot.txt
```

[Slide 20 - Performance operations checklist]
[Turn triage into habit: baseline weekly, alert on saturation, review trends, and rehearse incident response.]
```bash
# Weekly routine:
# 1) Review CPU/mem/disk/net trends
# 2) Verify alert thresholds
# 3) Run mini-triage drill
```
  </textarea>

  <script>
    function unwrapBracketLine(line) {
      const m = line.match(/^\[(.*)\]$/);
      return m ? m[1] : line;
    }

    function parseSlides(raw) {
      const lines = raw.replace(/\r\n/g, "\n").split("\n");
      const slides = [];
      let i = 0;

      while (i < lines.length) {
        while (i < lines.length && lines[i].trim() === "") i++;
        if (i >= lines.length) break;
        if (!/^\[.*\]$/.test(lines[i].trim())) {
          i++;
          continue;
        }

        const title = unwrapBracketLine(lines[i].trim());
        i++;

        while (i < lines.length && lines[i].trim() === "") i++;
        if (i >= lines.length) break;
        const explanation = /^\[.*\]$/.test(lines[i].trim())
          ? unwrapBracketLine(lines[i].trim())
          : lines[i].trim();
        i++;

        while (i < lines.length && lines[i].trim() === "") i++;
        let code = "";
        if (i < lines.length && lines[i].trim().startsWith("```")) {
          i++;
          const codeLines = [];
          while (i < lines.length && !lines[i].trim().startsWith("```")) {
            codeLines.push(lines[i]);
            i++;
          }
          if (i < lines.length) i++;
          code = codeLines.join("\n");
        }

        slides.push({ title, explanation, code });
      }

      return slides;
    }

    const source = document.getElementById("slide-source").value;
    const slides = parseSlides(source);

    const deckTitle = document.getElementById("deck-title");
    const titleEl = document.getElementById("slide-title");
    const explanationEl = document.getElementById("slide-explanation");
    const codeWrap = document.getElementById("slide-code-wrap");
    const codeEl = document.getElementById("slide-code");
    const counterEl = document.getElementById("counter");
    const progressBar = document.getElementById("progress-bar");

    const firstBtn = document.getElementById("first");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const lastBtn = document.getElementById("last");

    let index = 0;

    function updateDeckTitle() {
      const path = window.location.pathname;
      const folder = path.split("/").filter(Boolean).slice(-2, -1)[0] || "Ubuntu Deck";
      deckTitle.textContent = folder;
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function render() {
      if (!slides.length) {
        titleEl.textContent = "No slides found";
        explanationEl.textContent = "slides.md did not match the expected format.";
        codeWrap.style.display = "none";
        counterEl.textContent = "0 / 0";
        progressBar.style.width = "0%";
        firstBtn.disabled = prevBtn.disabled = nextBtn.disabled = lastBtn.disabled = true;
        return;
      }

      index = clamp(index, 0, slides.length - 1);
      const s = slides[index];
      titleEl.textContent = s.title;
      explanationEl.textContent = s.explanation;

      if (s.code && s.code.trim().length) {
        codeWrap.style.display = "block";
        codeEl.textContent = s.code;
      } else {
        codeWrap.style.display = "none";
        codeEl.textContent = "";
      }

      counterEl.textContent = (index + 1) + " / " + slides.length;
      progressBar.style.width = (((index + 1) / slides.length) * 100).toFixed(2) + "%";

      firstBtn.disabled = prevBtn.disabled = index === 0;
      nextBtn.disabled = lastBtn.disabled = index === slides.length - 1;
    }

    firstBtn.addEventListener("click", function () { index = 0; render(); });
    prevBtn.addEventListener("click", function () { index -= 1; render(); });
    nextBtn.addEventListener("click", function () { index += 1; render(); });
    lastBtn.addEventListener("click", function () { index = slides.length - 1; render(); });

    window.addEventListener("keydown", function (event) {
      if (event.key === "ArrowRight" || event.key === "PageDown") {
        index += 1;
        render();
      }
      if (event.key === "ArrowLeft" || event.key === "PageUp") {
        index -= 1;
        render();
      }
      if (event.key === "Home") {
        index = 0;
        render();
      }
      if (event.key === "End") {
        index = slides.length - 1;
        render();
      }
    });

    updateDeckTitle();
    render();
  </script>
</body>
</html>
