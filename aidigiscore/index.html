<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AI-DigiScore Enterprise Decision Harness. Explore versioned decisions, agent proposals and audit history.">
<title>AI-DigiScore | Decision Harness</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header class="top"><a class="brand" href="./"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong>AI-DigiScore<small>Enterprise decision harness</small></strong></a><div class="account"><label>Tenant <select id="tenant"></select></label><span id="chain" class="badge"></span></div></header>
<div id="medical" role="note" hidden></div>
<div class="shell">
<aside><div class="side-label">Workspace</div><nav id="nav" aria-label="Workspace"></nav><details class="about"><summary>About this demo</summary><p>AI-DigiScore concepts by Patrick Hopper. Built in collaboration with Pandu Sastrowardoyo and Danny (Jean-Daniel Gauthier).</p><a href="https://github.com/Decentricity/decentricity.github.io/blob/gh-pages/aidigiscore/README.md">Read the project brief ↗</a></details></aside>
<main>
<header class="view-header"><h1 id="heading">Team chats</h1><p id="view-description"></p></header>
<section class="player" aria-label="Scenario player"><label>Scenario <select id="scenario"></select></label><div class="controls"><button id="reset">Reset</button><button id="play">Play</button><button id="next">Next step →</button></div><label>State <select id="step"></select></label></section>
<p id="error" role="alert" hidden></p>
<div id="panel" aria-busy="true">Loading workspace…</div>
</main>
</div>
<script type="module" src="./app.mjs"></script>
</body>
</html>
