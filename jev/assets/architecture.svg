<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">Jev interprets; code controls</title><desc id="desc">Message, roles, current state, and typed questions go to Jev. Its typed judgments go to a Python controller which enforces business rules and selects authored replies. Updated state and dialogue feed into the next turn.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#aaa0b5" stroke-width="1.4"/></marker></defs>
<style>text{fill:#f2ede6;font-family:system-ui,sans-serif}.label{fill:#bbb0c2;font-size:12px;letter-spacing:1px}.title{font-size:24px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#bbb0c2}.mono{font-family:ui-monospace,monospace}.pink{fill:#f0a1d0}.lime{fill:#cbef99}.line{fill:none;stroke:#aaa0b5;stroke-width:1.5;marker-end:url(#arrow)}</style>
<text x="24" y="35" class="label">ONE TURN · FOUR DISTINCT JOBS</text>
<rect x="20" y="85" width="235" height="205" fill="#26212e"/>
<text x="40" y="115" class="label">01 / CONTEXT</text><text x="40" y="151" class="title">What we know</text>
<text x="40" y="185" class="body">Current message</text><text x="40" y="213" class="body">Roles + deal state</text><text x="40" y="241" class="body">Prior dialogue + policy</text><text x="40" y="271" class="small">No future turns or test labels</text>
<path d="M260 183H290" class="line"/>
<rect x="300" y="85" width="235" height="205" fill="#342437"/>
<text x="320" y="115" class="label">02 / JEV</text><text x="320" y="151" class="title pink">Interpret</text>
<text x="320" y="185" class="body">14 typed questions</text><text x="320" y="213" class="body">One shared state</text><text x="320" y="241" class="body">One batched API call</text><text x="320" y="271" class="small">+ budget Choice if applicable</text>
<path d="M540 183H570" class="line"/>
<rect x="580" y="85" width="235" height="205" fill="#26212e"/>
<text x="600" y="115" class="label">03 / TYPED ANSWERS</text><text x="600" y="151" class="title">Judgments</text>
<text x="600" y="185" class="body mono">Choice: agreement</text><text x="600" y="213" class="body mono">Noul: 0.95</text><text x="600" y="241" class="body mono">Score: 2.00 / 3</text><text x="600" y="271" class="small">Examples from pilot turn 4</text>
<path d="M820 183H850" class="line"/>
<rect x="860" y="85" width="235" height="205" fill="#273028"/>
<text x="880" y="115" class="label">04 / PYTHON</text><text x="880" y="151" class="title lime">Apply the rules</text>
<text x="880" y="185" class="body">Check role + approvals</text><text x="880" y="213" class="body">Select authored reply</text><text x="880" y="241" class="body">Update scoped state</text><text x="880" y="271" class="small">No external actions executed</text>
<path d="M978 300V340H138V303" class="line"/>
<rect x="378" y="324" width="373" height="32" fill="#1c1823"/><text x="565" y="347" text-anchor="middle" class="small">Updated state + dialogue inform the next turn</text>
<text x="560" y="407" text-anchor="middle" class="small">Scores describe the conversation here. They do not override an approval gate.</text>
</svg>
