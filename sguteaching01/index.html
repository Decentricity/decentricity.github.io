<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Machine: Blockchain Arcade Lecture</title>
  <meta name="description" content="A seven-scene interactive blockchain teaching demo about history, consensus, programmable state, DeFi, and MEV.">
  <meta property="og:title" content="History Machine">
  <meta property="og:description" content="A seven-scene interactive blockchain teaching demo.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <main class="deck">
      <section class="stage" aria-live="polite">
        <div class="game-board" id="gameBoard"></div>

        <div class="menu-shell">
          <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="controlMenu" aria-label="Open controls">☰</button>
          <div class="control-menu" id="controlMenu" hidden>
            <div class="menu-status">
              <p class="scene-kicker" id="sceneKicker">Slide 1 / 7</p>
              <h2 id="sceneTitle"></h2>
              <div class="scene-time" id="sceneTime"></div>
              <p class="scene-thesis" id="sceneThesis"></p>
            </div>

            <div class="timer" aria-label="Ten minute timer">
              <span id="timerReadout">00:00</span>
              <button id="timerToggle" type="button">Start</button>
              <button id="timerReset" type="button">Reset</button>
            </div>

            <div class="deck-controls" aria-label="Slide controls">
              <button id="prevSlide" type="button">Back</button>
              <button id="stepScene" type="button">Step</button>
              <button id="resetScene" type="button">Reset Scene</button>
              <button id="keyLine" type="button">Key Line</button>
              <button id="nextSlide" type="button">Next</button>
            </div>

            <div class="progress-wrap" aria-label="Slide progress">
              <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
              </div>
              <div class="progress-dots" id="progressDots"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="lineModal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <p class="panel-label" id="modalTitle">Key line</p>
      <p id="modalText"></p>
      <button id="closeModal" type="button">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
