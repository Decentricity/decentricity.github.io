<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ubuntu Training Slides</title>
  <style>
    :root {
      --bg1: #fff7fb;
      --bg2: #ffeaf4;
      --bg3: #ffe1ef;
      --panel: #fff9fd;
      --text: #5b3a4c;
      --muted: #8f6680;
      --accent: #e98ab7;
      --accent-2: #d86ca2;
      --line: #f3c8dd;
      --code-bg: #fff3fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, #ffeef7 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, #ffe3f0 0%, transparent 35%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 249, 253, 0.82);
      backdrop-filter: blur(4px);
    }

    .deck-title {
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .counter {
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .slide {
      width: min(980px, 96vw);
      height: min(74vh, 720px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(1rem, 2vw, 2rem);
      box-shadow: 0 10px 30px rgba(216, 108, 162, 0.14);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 3.1vw, 2rem);
      color: var(--accent-2);
      line-height: 1.25;
    }

    .explanation {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.45;
      color: var(--text);
    }

    pre {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--code-bg);
      padding: 0.9rem;
      overflow: auto;
      font-size: 0.92rem;
      line-height: 1.35;
      color: #6a2f4d;
    }

    code {
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      white-space: pre;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.55rem;
      padding: 0.8rem 1rem 1rem;
      border-top: 1px solid var(--line);
      background: rgba(255, 249, 253, 0.78);
      backdrop-filter: blur(4px);
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 0.5rem 0.85rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 64px;
    }

    button:hover { background: #fff3fa; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .hint {
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .progress {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 4px;
      background: #f6d9e8;
    }

    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 180ms ease;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="deck-title" id="deck-title">Ubuntu Training Deck</div>
    <div class="counter" id="counter">0 / 0</div>
  </header>

  <main>
    <section class="slide" aria-live="polite">
      <h1 id="slide-title"></h1>
      <p id="slide-explanation" class="explanation"></p>
      <pre id="slide-code-wrap"><code id="slide-code"></code></pre>
    </section>
  </main>

  <footer class="controls">
    <button id="first" type="button">|&lt;</button>
    <button id="prev" type="button">&lt;</button>
    <button id="next" type="button">&gt;</button>
    <button id="last" type="button">&gt;|</button>
    <div class="hint">Use Left/Right arrow keys, Home/End, or buttons.</div>
  </footer>

  <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>

  <textarea id="slide-source" hidden>
[Slide 1 - Backup is not recovery]
[A successful backup job does not guarantee recovery; only tested restores prove resilience.]
```bash
date
hostnamectl
```

[Slide 2 - Define RPO and RTO]
[RPO is acceptable data loss window; RTO is acceptable downtime window. These values drive backup design.]
```bash
# Example targets:
# RPO = 1 hour
# RTO = 2 hours
```

[Slide 3 - What to back up first]
[Prioritize irreplaceable data: databases, app data, configs, secrets, and automation scripts.]
```bash
sudo du -sh /etc /var/lib /home 2>/dev/null
sudo find /etc -maxdepth 2 -type f | head
```

[Slide 4 - Backup scope inventory]
[Create a written inventory mapping each data set to owner, location, retention, and restore priority.]
```bash
lsblk -f
mount | column -t | head -n 20
```

[Slide 5 - Full vs incremental backups]
[Full backups are simple but heavy; incrementals reduce storage and time but complicate restore chains.]
```bash
# Strategy example:
# Weekly full + daily incremental
```

[Slide 6 - Local backup with rsync]
[`rsync` is a practical baseline for filesystem backups with preserve flags and delete control.]
```bash
sudo rsync -aHAX --delete /etc /home /var/lib /backup/daily/
```

[Slide 7 - Exclusion and risk control]
[Exclude ephemeral paths and caches to reduce noise; never exclude critical state by accident.]
```bash
sudo rsync -aHAX --delete \
  --exclude='/var/cache/*' \
  --exclude='/tmp/*' \
  / /backup/rootfs/
```

[Slide 8 - Compression and archives]
[Archive snapshots make transport easy; choose compression based on CPU budget and restore speed needs.]
```bash
sudo tar -C / -czf /backup/etc-home-$(date +%F).tar.gz etc home
ls -lh /backup | tail
```

[Slide 9 - Encryption at rest]
[Backups often contain secrets; encrypt archives before offsite transfer or cloud storage.]
```bash
gpg --symmetric --cipher-algo AES256 /backup/etc-home-2026-02-12.tar.gz
```

[Slide 10 - Offsite and 3-2-1 rule]
[Keep 3 copies, 2 media types, and 1 offsite copy to survive device loss or site incidents.]
```bash
rclone copy /backup remote:server-backups --progress
```

[Slide 11 - Automate backup jobs]
[Schedule backups with timers or cron; log output and alert on failures to avoid silent drift.]
```bash
crontab -e
# 0 2 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1
```

[Slide 12 - Validate backup contents]
[Verify that expected files exist and checksums match to catch corruption early.]
```bash
find /backup/daily/etc -type f | wc -l
sha256sum /backup/etc-home-2026-02-12.tar.gz
```

[Slide 13 - Restore test: single file]
[Start with granular restores because most incidents are accidental deletion or bad config changes.]
```bash
sudo cp /backup/daily/etc/ssh/sshd_config /etc/ssh/sshd_config.restore
sudo diff -u /etc/ssh/sshd_config /etc/ssh/sshd_config.restore | head
```

[Slide 14 - Restore test: service data]
[Test restoring app or database directories in a staging path before touching production data.]
```bash
sudo mkdir -p /restore-test
sudo rsync -aHAX /backup/daily/var/lib/myapp/ /restore-test/myapp/
```

[Slide 15 - Bare metal recovery outline]
[Document order of operations: OS install, package restore, config restore, data restore, validation.]
```bash
# Recovery runbook skeleton:
# 1) Install Ubuntu
# 2) Install dependencies
# 3) Restore /etc and app data
# 4) Start services and verify
```

[Slide 16 - Measure real RTO]
[Time the full restore drill end-to-end and compare with target RTO to expose operational gaps.]
```bash
start=$(date +%s)
# perform restore steps
end=$(date +%s)
echo "Restore duration: $((end-start)) seconds"
```

[Slide 17 - Common backup failures]
[Frequent issues include missing permissions, full disks, stale mounts, and unmonitored cron failures.]
```bash
df -h
journalctl -u cron --since "24 hours ago" --no-pager
```

[Slide 18 - Immutable and versioned backups]
[Versioning and immutability protect against ransomware and operator mistakes that delete recent backups.]
```bash
# Example with borg (append-only remote suggested):
# borg create --stats repo::'{hostname}-{now}' /etc /home /var/lib
```

[Slide 19 - Restore acceptance checklist]
[A restore is complete only when service health, data integrity, permissions, and user access all validate.]
```bash
systemctl --failed
sudo find /restore-test -type f | wc -l
sudo grep -R "ERROR" /var/log | tail
```

[Slide 20 - Team backup operating rhythm]
[Assign ownership, test monthly, review retention quarterly, and update runbooks after every incident.]
```bash
# Monthly:
# - Run restore drill
# - Update backup inventory
# - File post-drill notes in runbook
```
  </textarea>

  <script>
    function unwrapBracketLine(line) {
      const m = line.match(/^\[(.*)\]$/);
      return m ? m[1] : line;
    }

    function parseSlides(raw) {
      const lines = raw.replace(/\r\n/g, "\n").split("\n");
      const slides = [];
      let i = 0;

      while (i < lines.length) {
        while (i < lines.length && lines[i].trim() === "") i++;
        if (i >= lines.length) break;
        if (!/^\[.*\]$/.test(lines[i].trim())) {
          i++;
          continue;
        }

        const title = unwrapBracketLine(lines[i].trim());
        i++;

        while (i < lines.length && lines[i].trim() === "") i++;
        if (i >= lines.length) break;
        const explanation = /^\[.*\]$/.test(lines[i].trim())
          ? unwrapBracketLine(lines[i].trim())
          : lines[i].trim();
        i++;

        while (i < lines.length && lines[i].trim() === "") i++;
        let code = "";
        if (i < lines.length && lines[i].trim().startsWith("```")) {
          i++;
          const codeLines = [];
          while (i < lines.length && !lines[i].trim().startsWith("```")) {
            codeLines.push(lines[i]);
            i++;
          }
          if (i < lines.length) i++;
          code = codeLines.join("\n");
        }

        slides.push({ title, explanation, code });
      }

      return slides;
    }

    const source = document.getElementById("slide-source").value;
    const slides = parseSlides(source);

    const deckTitle = document.getElementById("deck-title");
    const titleEl = document.getElementById("slide-title");
    const explanationEl = document.getElementById("slide-explanation");
    const codeWrap = document.getElementById("slide-code-wrap");
    const codeEl = document.getElementById("slide-code");
    const counterEl = document.getElementById("counter");
    const progressBar = document.getElementById("progress-bar");

    const firstBtn = document.getElementById("first");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const lastBtn = document.getElementById("last");

    let index = 0;

    function updateDeckTitle() {
      const path = window.location.pathname;
      const folder = path.split("/").filter(Boolean).slice(-2, -1)[0] || "Ubuntu Deck";
      deckTitle.textContent = folder;
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function render() {
      if (!slides.length) {
        titleEl.textContent = "No slides found";
        explanationEl.textContent = "slides.md did not match the expected format.";
        codeWrap.style.display = "none";
        counterEl.textContent = "0 / 0";
        progressBar.style.width = "0%";
        firstBtn.disabled = prevBtn.disabled = nextBtn.disabled = lastBtn.disabled = true;
        return;
      }

      index = clamp(index, 0, slides.length - 1);
      const s = slides[index];
      titleEl.textContent = s.title;
      explanationEl.textContent = s.explanation;

      if (s.code && s.code.trim().length) {
        codeWrap.style.display = "block";
        codeEl.textContent = s.code;
      } else {
        codeWrap.style.display = "none";
        codeEl.textContent = "";
      }

      counterEl.textContent = (index + 1) + " / " + slides.length;
      progressBar.style.width = (((index + 1) / slides.length) * 100).toFixed(2) + "%";

      firstBtn.disabled = prevBtn.disabled = index === 0;
      nextBtn.disabled = lastBtn.disabled = index === slides.length - 1;
    }

    firstBtn.addEventListener("click", function () { index = 0; render(); });
    prevBtn.addEventListener("click", function () { index -= 1; render(); });
    nextBtn.addEventListener("click", function () { index += 1; render(); });
    lastBtn.addEventListener("click", function () { index = slides.length - 1; render(); });

    window.addEventListener("keydown", function (event) {
      if (event.key === "ArrowRight" || event.key === "PageDown") {
        index += 1;
        render();
      }
      if (event.key === "ArrowLeft" || event.key === "PageUp") {
        index -= 1;
        render();
      }
      if (event.key === "Home") {
        index = 0;
        render();
      }
      if (event.key === "End") {
        index = slides.length - 1;
        render();
      }
    });

    updateDeckTitle();
    render();
  </script>
</body>
</html>
