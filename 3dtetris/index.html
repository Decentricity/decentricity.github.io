<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tetris - Decentricity</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #16213e 100%);
            color: #00ff88;
            overflow: hidden;
            height: 100vh;
        }
        
        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-panel {
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            pointer-events: auto;
        }
        
        .controls-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 220px;
        }
        
        .score-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            text-align: center;
        }
        
        .next-piece-panel {
            position: absolute;
            bottom: 120px;
            right: 10px;
            width: 150px;
            height: 120px;
        }
        
        .camera-panel {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 150px;
        }
        
        .movement-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 280px;
        }
        
        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        
        .movement-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        
        .rotation-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        
        button {
            background: linear-gradient(135deg, #001122 0%, #003366 100%);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            transition: all 0.2s;
            min-height: 32px;
        }
        
        button:hover {
            background: linear-gradient(135deg, #003366 0%, #0066aa 100%);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            transform: translateY(-1px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .score-item {
            margin: 8px 0;
            font-size: 14px;
            text-shadow: 0 0 5px rgba(0, 255, 136, 0.8);
        }
        
        .score-value {
            font-size: 18px;
            font-weight: bold;
            color: #ffaa00;
        }
        
        #next-piece-canvas {
            width: 100%;
            height: 80px;
            border: 1px solid #00ff88;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.5);
        }
        
        .footer {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            opacity: 0.7;
            pointer-events: auto;
        }
        
        .footer a {
            color: #00ff88;
            text-decoration: none;
        }
        
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            pointer-events: auto;
        }
        
        .game-over-panel {
            background: rgba(0, 20, 40, 0.95);
            border: 3px solid #ff4444;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
        }
        
        .game-over-title {
            font-size: 32px;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
        }
        
        .pause-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.95);
            border: 2px solid #ffaa00;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 150;
            pointer-events: auto;
        }
        
        .danger-zone {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff4444;
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            color: #ff4444;
            display: none;
            z-index: 120;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .controls-panel, .score-panel, .movement-controls, .camera-panel, .next-piece-panel {
                font-size: 12px;
                padding: 10px;
            }
            
            button {
                padding: 6px;
                font-size: 10px;
                min-height: 28px;
            }
        }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    
    <div id="ui-overlay">
        <div class="controls-panel ui-panel">
            <h3>CONTROLS</h3>
            <div class="control-grid">
                <button id="pause-btn">PAUSE</button>
                <button id="drop-btn">DROP</button>
                <button id="reset-btn">RESET</button>
            </div>
        </div>
        
        <div class="score-panel ui-panel">
            <h3>STATS</h3>
            <div class="score-item">Score: <span id="score" class="score-value">0</span></div>
            <div class="score-item">Lines: <span id="lines" class="score-value">0</span></div>
            <div class="score-item">Level: <span id="level" class="score-value">1</span></div>
            <div class="score-item">Time: <span id="time" class="score-value">0:00</span></div>
            <div class="score-item">Height: <span id="stack-height" class="score-value">0</span></div>
        </div>
        
        <div class="next-piece-panel ui-panel">
            <h4>NEXT</h4>
            <canvas id="next-piece-canvas"></canvas>
        </div>
        
        <div class="camera-panel ui-panel">
            <h4>CAMERA</h4>
            <div class="control-grid">
                <button id="cam-top">TOP</button>
                <button id="cam-iso">ISO</button>
                <button id="cam-side">SIDE</button>
            </div>
        </div>
        
        <div class="movement-controls ui-panel">
            <h4>MOVEMENT & ROTATION</h4>
            <div class="movement-grid">
                <span></span>
                <button id="move-back">BACK</button>
                <span></span>
                <span></span>
                <button id="move-left">LEFT</button>
                <button id="move-down">DOWN</button>
                <button id="move-right">RIGHT</button>
                <span></span>
                <span></span>
                <button id="move-forward">FWD</button>
                <span></span>
                <span></span>
            </div>
            <div class="rotation-grid">
                <button id="rot-x">ROT-X</button>
                <button id="rot-y">ROT-Y</button>
                <button id="rot-z">ROT-Z</button>
            </div>
        </div>
        
        <div class="danger-zone" id="danger-zone">
            â ï¸ DANGER ZONE! Stack is getting too high! â ï¸
        </div>
        
        <div class="game-over-overlay" id="game-over">
            <div class="game-over-panel">
                <div class="game-over-title">GAME OVER</div>
                <div class="score-item">Final Score: <span id="final-score" class="score-value">0</span></div>
                <div class="score-item">Lines Cleared: <span id="final-lines" class="score-value">0</span></div>
                <div class="score-item">Max Height: <span id="final-height" class="score-value">0</span></div>
                <div style="margin-top: 20px;">
                    <button id="restart-btn" style="padding: 10px 20px; font-size: 14px;">PLAY AGAIN</button>
                </div>
                <div style="margin-top: 10px; font-size: 12px; opacity: 0.8;">
                    "That's not how gravity works!" ð¤
                </div>
            </div>
        </div>
        
        <div class="pause-overlay" id="pause-overlay">
            <div style="font-size: 24px; color: #ffaa00; margin-bottom: 10px;">PAUSED</div>
            <div>Press PAUSE to continue</div>
        </div>
        
        <div class="footer">
            
        </div>
    </div>
    
    <script>
        // Ensure Three.js and OrbitControls are available before starting the game
        function waitForThreeJS() {
            if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined') {
                // Load the game script
                const script = document.createElement('script');
                script.src = 'app.js';
                document.head.appendChild(script);
            } else {
                setTimeout(waitForThreeJS, 100);
            }
        }
        
        // Start waiting for Three.js to load
        waitForThreeJS();
    </script>
</body>
</html>
